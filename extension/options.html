<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>CodeFactory Browser Bridge</title>
    <style>
      body {
        font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 16px;
        width: 320px;
        color: #1f2328;
      }
      h1 { font-size: 14px; margin: 0 0 4px; }
      p { margin: 0 0 12px; color: #59636e; }
      label { display: block; font-size: 12px; margin-bottom: 4px; color: #59636e; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #d1d9e0;
        border-radius: 6px;
        font: inherit;
        margin-bottom: 10px;
      }
      button {
        width: 100%;
        padding: 7px;
        border: 0;
        border-radius: 6px;
        background: #1f6feb;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      #status {
        padding: 8px 10px;
        border-radius: 6px;
        background: #f6f8fa;
        font-size: 12px;
      }
      details { margin-top: 14px; }
      summary {
        cursor: pointer;
        font-size: 12px;
        color: #59636e;
      }
      details > div { margin-top: 10px; }
      .hint { font-size: 11px; color: #59636e; margin: 6px 0 0; }
      @media (prefers-color-scheme: dark) {
        body { background: #0d1117; color: #e6edf3; }
        p, label, summary, .hint { color: #9198a1; }
        input { background: #0d1117; border-color: #3d444d; color: #e6edf3; }
        #status { background: #151b23; }
      }
    </style>
  </head>
  <body>
    <h1>CodeFactory 浏览器桥</h1>

    <div id="status">正在检查连接状态…</div>
    <p class="hint" id="detail"></p>

    <!--
      Manual pairing is collapsed, not removed. CodeFactory writes the live port
      and pairing code into this extension's own folder, so the normal path needs
      no typing at all; the form is here only for a copy of the extension the app
      did not write out itself.
    -->
    <details id="manual">
      <summary>手动配对（一般不需要）</summary>
      <div>
        <p class="hint">
          只有当这个扩展不是由 CodeFactory 自己写出的目录加载时才需要：到 CodeFactory
          「设置 → 浏览器」复制端口和配对码。
        </p>

        <label for="port">端口</label>
        <input id="port" inputmode="numeric" placeholder="例如 47615" />

        <label for="token">配对码</label>
        <input id="token" placeholder="32 位字符" />

        <button id="save">保存并连接</button>
      </div>
    </details>

    <script src="options.js"></script>
  </body>
</html>
