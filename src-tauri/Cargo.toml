[package]
name = "codefactory"
version = "1.32.0"
description = "AI coding assistant for Windows powered by OpenRouter"
authors = []
edition = "2021"
license = "Apache-2.0"

[lib]
name = "codefactory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri        = { version = "2", features = [] }
tauri-plugin-shell   = "2"
tauri-plugin-dialog  = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Trimmed tokio feature set 闂?was "full" which pulls every subsystem
# including net/signal/parking_lot/test-util we don't use. Audit-based
# minimum: rt-multi-thread (tokio::spawn), macros (#[tokio::main/test]),
# sync (Mutex/RwLock/oneshot), time (sleep/timeout), fs (atomic_write
# + reads), process (bash tool Command), io-util (BufReader and friends).
# Saves ~30-40s of compile time on cold builds.
tokio        = { version = "1", features = [
    "rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util",
] }
reqwest      = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono", "uuid"] }

portable-pty = "0.8"

dirs       = "5"
keyring   = { version = "=3.6.3", features = ["apple-native", "windows-native"] }
dashmap    = "6"
once_cell  = "1"
globset    = "0.4"
regex    = "1"
walkdir  = "2"
zip      = { version = "4.6.1", default-features = false, features = ["deflate"] }
calamine = "0.26"
rust_xlsxwriter = "0.79"
git2     = { version = "0.19", default-features = false }
memchr   = "=2.7.4"   # 2.8.0 has union-field bug on Windows MSVC
anyhow   = "1"
thiserror = "2"
uuid     = { version = "1", features = ["v4"] }
chrono   = { version = "0.4", features = ["serde"] }
base64   = "0.22"
sha2     = "0.10"          # PKCE S256 challenge for Codex/ChatGPT OAuth
getrandom = "0.2"          # PKCE verifier + CSRF state randomness (lighter than rand)
tracing  = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = "thin"
opt-level     = "s"
strip         = true
# Note: the GitHub Actions release workflow overrides codegen-units and lto
# via CARGO_PROFILE_RELEASE_* env vars to trade binary size for build time.
# Local `cargo build --release` keeps the size-optimised defaults above.
