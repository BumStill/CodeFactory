[package]
name = "codefactory-agent-headless"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
codefactory-agent-core = { path = "../agent-core" }
codefactory-agent-loop = { path = "../agent-loop" }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "time"] }
