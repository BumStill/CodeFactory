[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}\

---

### Install

**Windows** — download `CodeFactory_X.Y.Z_x64-setup.exe` below and run it. A
SmartScreen warning is expected on first install (the app isn't signed with a
paid Authenticode certificate yet) — click **More info → Run anyway**.

**macOS (Apple Silicon)** — download `CodeFactory_X.Y.Z_aarch64.dmg` below, open
it and drag CodeFactory to Applications. The app isn't notarized with an Apple
Developer ID yet, so Gatekeeper blocks it on first launch: **right-click (or
Control-click) the app → Open → Open**, or allow it under **System Settings →
Privacy & Security**. Requires macOS 11 or later.

After the first manual install on either platform, in-app auto-updates are
verified via the Tauri signature (`.sig`) against an embedded public key and
don't trigger these warnings.

See the [README](https://github.com/BumStill/CodeFactory#install) for the
code-signing roadmap.
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat",     group = "✨ Features"     },
  { message = "^fix",      group = "🐛 Bug Fixes"    },
  { message = "^perf",     group = "⚡ Performance"  },
  { message = "^refactor", group = "♻️ Refactoring"  },
  { message = "^doc",      group = "📚 Documentation" },
  { message = "^test",     group = "🧪 Testing"      },
  { message = "^chore|^ci|^build|^style", skip = true },
]
filter_commits = true
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
