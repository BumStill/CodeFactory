# Governance rules — the single, executable source of truth.
#
# Every cross-cutting principle is declared here ONCE. Agent convention files
# (AGENTS.md, CLAUDE.md) point at this file rather than re-stating rules, and
# tools/governance/check_governance_rules.py enforces it on every PR/push — so
# the harness binds regardless of which agent (or human) made the change.
# See docs/governance/agent-conformance.md.
#
# Schema per rule:
#   id          unique slug
#   statement   one-line normative statement
#   doc         canonical doc path (must exist)
#   enforcement structural | check | review
#   enforcer    artifact that makes/keeps the rule true (must exist)
#   level       warn | error   (only for enforcement: check)

version: "2026-08-03"

rules:
  - id: release-cadence
    statement: "Merge continuously, release deliberately; releases are never triggered by a merge."
    doc: docs/principles/release-cadence.md
    enforcement: structural
    enforcer: .github/workflows/auto-release.yml

  - id: readme-update-contract
    statement: "README is an evergreen product contract: every PR declares its impact, required updates land with the change, and releases do not rewrite it."
    doc: docs/principles/readme-update-cadence.md
    enforcement: structural
    enforcer: tools/governance/validate_readme_contract.py

  - id: design-doc-for-major
    statement: "Every major change lands a design doc in the tree (docs/specs|design|principles)."
    doc: docs/principles/design-docs-for-major-changes.md
    enforcement: check
    enforcer: tools/governance/check_governance_rules.py
    level: warn

  - id: agent-conformance
    statement: "Harness rules are enforced at the CI gate (agent-agnostic), not by agent goodwill."
    doc: docs/governance/agent-conformance.md
    enforcement: structural
    enforcer: .github/workflows/governance-baseline.yml

  - id: main-pr-ci-gate
    statement: "The default branch accepts human changes only through a PR with all required checks green."
    doc: docs/design/github-main-gates-business-design.md
    enforcement: structural
    enforcer: .github/rulesets/main.json

  - id: ux-verify-before-merge
    statement: "User-facing behavior changes must be verified in the running app before they ship."
    doc: AGENTS.md
    enforcement: review
    enforcer: AGENTS.md

  - id: evidence-pack-retention
    statement: "One-off timestamped evidence-pack snapshots don't accumulate in docs/evidence-packs/; only *-locked-* baselines are long-lived there."
    doc: docs/evidence-packs/README.md
    enforcement: check
    enforcer: tools/governance/check_governance_rules.py
    level: warn
