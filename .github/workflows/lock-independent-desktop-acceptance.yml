name: Lock-independent Desktop Acceptance

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lock-independent-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  remote-real-app-gui:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build exact desktop candidate
        run: >-
          pnpm tauri build --debug --bundles app
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify exact app in remote visible session
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/codefactory-desktop-evidence
        run: |
          APP_PATH="src-tauri/target/debug/bundle/macos/CodeFactory.app"
          test -d "$APP_PATH"
          swift scripts/verify-macos-app-window.swift "$APP_PATH" 45 "$EVIDENCE_DIR"
          test -s "$EVIDENCE_DIR/window.json"
          test -s "$EVIDENCE_DIR/window.png"

      - name: Upload remote GUI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lock-independent-desktop-evidence
          path: ${{ runner.temp }}/codefactory-desktop-evidence
          if-no-files-found: error
