name: macOS Release Artifact Smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify, for example v1.42.6
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Download published macOS artifacts and manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/codefactory-release"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'CodeFactory_*_aarch64.dmg' \
            --dir "$RUNNER_TEMP/codefactory-release"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'CodeFactory_aarch64.app.tar.gz' \
            --dir "$RUNNER_TEMP/codefactory-release"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'latest.json' \
            --dir "$RUNNER_TEMP/codefactory-release"

      - name: Verify installed macOS release artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CODEFACTORY_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/codefactory-release-evidence
          CODEFACTORY_GUI_PROOF_TIER: released-artifact-gui
        run: |
          mkdir -p "$CODEFACTORY_RELEASE_EVIDENCE_DIR"
          DMG_DIR="$RUNNER_TEMP/codefactory-release"
          DMG_COUNT="$(find "$DMG_DIR" -type f -name '*.dmg' | wc -l | tr -d ' ')"
          UPDATER_COUNT="$(find "$DMG_DIR" -type f -name '*.app.tar.gz' | wc -l | tr -d ' ')"
          if [ "$DMG_COUNT" != "1" ] || [ "$UPDATER_COUNT" != "1" ] || [ ! -f "$DMG_DIR/latest.json" ]; then
            echo "::error::expected exactly one arm64 DMG, one updater archive, and latest.json"
            exit 1
          fi
          DMG_PATH="$(find "$DMG_DIR" -type f -name '*.dmg' -print -quit)"
          UPDATER_ARCHIVE="$(find "$DMG_DIR" -type f -name '*.app.tar.gz' -print -quit)"
          EXPECTED_BUILD_SHA="$(git rev-parse HEAD)"
          scripts/verify-macos-release-artifact.sh \
            "$DMG_PATH" "${RELEASE_TAG#v}" "$EXPECTED_BUILD_SHA" \
            "$UPDATER_ARCHIVE" "$DMG_DIR/latest.json"

      - name: Upload installed release GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-gui-evidence-${{ inputs.tag }}
          path: ${{ runner.temp }}/codefactory-release-evidence
          if-no-files-found: error
