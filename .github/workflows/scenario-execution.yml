name: scenario-execution

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run_windows: ${{ steps.plan.outputs.run_windows }}
      windows_node: ${{ steps.plan.outputs.windows_node }}
      windows_rust: ${{ steps.plan.outputs.windows_rust }}
      run_macos: ${{ steps.plan.outputs.run_macos }}
      macos_node: ${{ steps.plan.outputs.macos_node }}
      macos_rust: ${{ steps.plan.outputs.macos_rust }}
    steps:
      - name: Checkout trusted base policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Require trusted base execution planner
        shell: bash
        run: |
          if [[ ! -f policy/tools/governance/scenario_execution.py ]]; then
            echo "::error::Trusted base does not contain scenario_execution.py; this trust-root upgrade requires the documented external governance bootstrap"
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Select affected scenarios and targets
        id: plan
        run: >-
          python policy/tools/governance/scenario_execution.py plan
          --registry policy/docs/testing/scenario-registry.json
          --repo candidate
          --base-sha "${{ github.event.pull_request.base.sha }}"
          --head-sha "${{ github.event.pull_request.head.sha }}"
          --output scenario-plan.json
          --github-output "$GITHUB_OUTPUT"
      - name: Upload immutable execution plan
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: affected-scenario-plan
          path: scenario-plan.json
          if-no-files-found: error

  execute-windows:
    needs: plan
    if: ${{ needs.plan.outputs.run_windows == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout trusted base policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy
          persist-credentials: false
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: affected-scenario-plan
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: ${{ needs.plan.outputs.windows_node == 'true' }}
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ needs.plan.outputs.windows_node == 'true' }}
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - name: Install frontend dependencies
        if: ${{ needs.plan.outputs.windows_node == 'true' }}
        working-directory: candidate
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: ${{ needs.plan.outputs.windows_rust == 'true' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: ${{ needs.plan.outputs.windows_rust == 'true' }}
        with:
          workspaces: candidate/src-tauri
      - name: Execute affected Windows targets
        run: python policy/tools/governance/scenario_execution.py execute --plan scenario-plan.json --repo candidate --runner windows-latest --output runner-receipt.json
      - name: Upload Windows target receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: affected-scenario-runner-windows-attempt-${{ github.run_attempt }}
          path: runner-receipt.json
          if-no-files-found: error

  execute-macos:
    needs: plan
    if: ${{ needs.plan.outputs.run_macos == 'true' }}
    # GitHub retired the macos-14 image. "macos-14" stays the policy's runner name;
    # receipts bind to its os and arch, which macos-15 also reports.
    runs-on: macos-15
    steps:
      - name: Checkout trusted base policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy
          persist-credentials: false
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: affected-scenario-plan
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: ${{ needs.plan.outputs.macos_node == 'true' }}
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ needs.plan.outputs.macos_node == 'true' }}
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - name: Install frontend dependencies
        if: ${{ needs.plan.outputs.macos_node == 'true' }}
        working-directory: candidate
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: ${{ needs.plan.outputs.macos_rust == 'true' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: ${{ needs.plan.outputs.macos_rust == 'true' }}
        with:
          workspaces: candidate/src-tauri
      - name: Execute affected macOS targets
        run: python policy/tools/governance/scenario_execution.py execute --plan scenario-plan.json --repo candidate --runner macos-14 --output runner-receipt.json
      - name: Upload macOS target receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: affected-scenario-runner-macos-attempt-${{ github.run_attempt }}
          path: runner-receipt.json
          if-no-files-found: error

  receipt:
    needs: [plan, execute-windows, execute-macos]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: affected-scenario-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: affected-scenario-runner-*
          path: receipts
          merge-multiple: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Aggregate exact-head execution receipts
        run: python policy/tools/governance/scenario_execution.py aggregate --plan scenario-plan.json --receipts receipts --output scenario-execution-receipt.json
      - name: Upload final exact-head receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: affected-scenario-receipt-${{ github.event.pull_request.head.sha }}-attempt-${{ github.run_attempt }}
          path: scenario-execution-receipt.json
          if-no-files-found: error
