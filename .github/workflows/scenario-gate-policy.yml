name: scenario-gate-policy

# This workflow is loaded from the default branch. It validates the candidate
# with the base branch's runner, so a PR cannot weaken its own validator or
# workflow and then use that weakened copy to self-attest.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  scenario-gate-policy:
    name: scenario-gate-policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout untrusted candidate without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate candidate with trusted base runner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          cd policy
          python tools/governance/run_scenario_harness_gate.py \
            --stage pull_request \
            --repo ../candidate \
            --policy-repo . \
            --base-ref "$BASE_SHA" \
            --event-path "$EVENT_PATH"
