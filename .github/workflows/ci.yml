name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  agent-bridge-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Harbor runtime
        run: python -m pip install --disable-pip-version-check harbor==0.15.0

      - name: Agent bridge and evaluation tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_*.py'

  check-frontend:
    # Frontend + governance gates. Independent of the Rust chain, so the two run in parallel: `check` used to pay their sum (583s) instead of their max.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # README-Update: required compares the PR base SHA with HEAD.
          # A shallow checkout does not contain the base object, so the
          # contract check would fail before it can inspect the real diff.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        id: deps
        run: pnpm install --frozen-lockfile

      # ── Every gate below reports its own verdict ────────────────────────────
      #
      # These steps used to run in a plain sequence, so the FIRST failure
      # skipped all the rest and the job told you nothing about them. Run
      # 30795455214 is the case that forced this change: a timing-sensitive
      # Vitest case lost to a loaded Windows runner, and CI then skipped the
      # entire Rust suite and both evidence uploads — on a PR whose only change
      # was Rust. A red `check` has to mean "here is what broke", not "here is
      # the first thing that broke".
      #
      # `!cancelled()` rather than `always()`: on failure we want the remaining
      # gates, but when a human cancels the run we want it to actually stop
      # instead of holding a (2x-billed) Windows runner for another ~6 minutes.
      # A step that fails still fails the job — later successes do not mask it.
      #
      # Cost: a frontend-only failure now runs the Rust suite too, taking the
      # job from ~5min to the ~10min of a full green run. That is the price of
      # one run reporting the true state of both sides.
      #
      # The frontend gates are additionally conditioned on `deps` succeeding —
      # without node_modules they would each fail for the same uninformative
      # reason. The Rust gates need only the toolchain, so they stay
      # independent of anything above them.
      - name: Type-check frontend
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm exec tsc --noEmit

      # Frontend regression tests (Vitest + jsdom + React Testing Library).
      # Currently covers the stick-to-bottom scroll hook, which shipped
      # broken in v0.3.7 and v0.3.9 before tests existed.
      - name: Vitest
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm test

      - name: Release workflow contract tests
        if: ${{ !cancelled() }}
        run: python -m unittest tests.test_release_workflow

      - name: Historical long-task scenario contract
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm test:unattended-contract

      - name: Historical session restart scenario contract
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm test:history-session-contract

      - name: Shared cargo wrapper contract
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm test:cargo-shared

      - name: README contract
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          README_CONTRACT_EVENT_PATH: ${{ github.event_path }}
          README_CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tools/governance/validate_readme_contract.py --ci

      - name: Frontend test contract
        if: ${{ !cancelled() }}
        env:
          FRONTEND_TEST_EVENT_PATH: ${{ github.event_path }}
          FRONTEND_TEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tools/governance/validate_frontend_test_contract.py --ci

      - name: Evolution workbench headless viewport gate
        id: evolution_gate
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm test:evolution:headless
        env:
          CODEFACTORY_EVOLUTION_ARTIFACT_DIR: ${{ runner.temp }}/codefactory-evolution-headless

      # Evidence is mandatory whenever the gate actually ran (pass or fail), but
      # demanding it when the gate was skipped just manufactures a second red
      # step — `if-no-files-found: error` did exactly that in run 30795455214.
      - name: Upload evolution viewport evidence
        if: ${{ !cancelled() && steps.evolution_gate.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: evolution-workbench-headless-${{ runner.os }}
          path: ${{ runner.temp }}/codefactory-evolution-headless
          if-no-files-found: error

      - name: Resume journal headless viewport gate
        id: resume_gate
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm test:resume:headless
        env:
          CODEFACTORY_RESUME_ARTIFACT_DIR: ${{ runner.temp }}/codefactory-resume-headless

      - name: Upload resume journal viewport evidence
        if: ${{ !cancelled() && steps.resume_gate.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: resume-journal-headless-${{ runner.os }}
          path: ${{ runner.temp }}/codefactory-resume-headless
          if-no-files-found: error

      - name: Turn handback headless gate
        id: handback_gate
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm test:turn-handback:headless
        env:
          CODEFACTORY_TURN_HANDBACK_ARTIFACT_DIR: ${{ runner.temp }}/codefactory-turn-handback-headless

      - name: Upload turn handback evidence
        if: ${{ !cancelled() && steps.handback_gate.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: turn-handback-headless-${{ runner.os }}
          path: ${{ runner.temp }}/codefactory-turn-handback-headless
          if-no-files-found: error

      - name: Compact composer headless viewport gate
        id: composer_gate
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm test:draft-project-picker:headless
        env:
          CODEFACTORY_DRAFT_PROJECT_PICKER_ARTIFACT_DIR: ${{ runner.temp }}/codefactory-compact-composer-headless

      - name: Upload compact composer viewport evidence
        if: ${{ !cancelled() && steps.composer_gate.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: compact-composer-headless-${{ runner.os }}
          path: ${{ runner.temp }}/codefactory-compact-composer-headless
          if-no-files-found: error


      # Run the Rust test suite. New regressions like the v0.3.7
      # "old sessions won't open" bug land here as failing tests so we
      # catch them before tagging a release instead of after a user
      # reports it.

  check-rust:
    # Rust build, tests and executable smokes. Needs no pnpm — every smoke here shells out to `cargo run`.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # README-Update: required compares the PR base SHA with HEAD.
          # A shallow checkout does not contain the base object, so the
          # contract check would fail before it can inspect the real diff.
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo test
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --quiet

      # The command classifier and shared execution contracts live in their
      # own workspace member. If this package is omitted, a production command
      # such as `npm test` can silently change from verification to mutation
      # while the root and loop test jobs remain green.
      - name: Cargo test (agent-core crate)
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path src-tauri/Cargo.toml -p codefactory-agent-core --quiet

      # The root `cargo test` covers only the `codefactory` package. The shared
      # tauri-free loop crate (keystone slice 4) is a separate workspace member,
      # so test it explicitly — future slices move real loop logic here.
      - name: Cargo test (agent-loop crate)
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path src-tauri/Cargo.toml -p codefactory-agent-loop --quiet

      # Same reason as agent-loop: the headless eval sidecar is its own workspace
      # member, so neither the root `cargo test` nor the agent-loop step compiles
      # it. Without this step its tests are invisible to CI — which is exactly how
      # #260 shipped three red sidecar tests (tool_choice regressions) unnoticed.
      - name: Cargo test (agent-headless crate)
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path src-tauri/Cargo.toml -p codefactory-agent-headless --quiet

      - name: Evolution executable closed-loop smoke
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $receipt = Join-Path $env:RUNNER_TEMP "evolution-smoke.json"
          cargo run --manifest-path src-tauri/Cargo.toml -- --evolution-smoke $receipt
          if ($LASTEXITCODE -ne 0) { throw "Evolution executable smoke exited $LASTEXITCODE" }
          $smoke = Get-Content $receipt -Raw | ConvertFrom-Json
          if ($smoke.status -ne "pass") { throw "Evolution smoke status was not pass" }
          if (-not $smoke.failed_eval_blocked_activation) { throw "Failed Eval did not block activation" }
          if ($smoke.eval_passed_count -ne $smoke.eval_required_count) { throw "Required Evals did not all pass" }
          if (-not $smoke.restart_reopen_observed) { throw "Evolution state was not verified after reopen" }
          if ($smoke.rollback_status -ne "rolled_back") { throw "Activation did not roll back" }
          if (-not $smoke.cleanup) { throw "Evolution smoke did not clean isolated state" }

      # Keystone slice 3: prove the packaged Windows binary can construct the
      # REAL AgentLoop headless (app: None) with the full tool surface — the
      # loader path #166 made fragile. Runs on the actual executable, not the
      # unit-test EXE, which is the safe place to exercise the headless seam.
      - name: Headless AgentLoop construction smoke
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $receipt = Join-Path $env:RUNNER_TEMP "headless-smoke.json"
          cargo run --manifest-path src-tauri/Cargo.toml -- --headless-smoke $receipt
          if ($LASTEXITCODE -ne 0) { throw "Headless smoke exited $LASTEXITCODE" }
          $smoke = Get-Content $receipt -Raw | ConvertFrom-Json
          if (-not $smoke.ok) { throw "Headless smoke did not report ok" }
          if ($smoke.app_handle -ne "none") { throw "Headless smoke ran with an AppHandle" }
          if ($smoke.tool_count -lt 1) { throw "Headless tool surface was empty" }
          if ($smoke.events_recorded -ne 1) { throw "Headless event sink did not record" }

      # Historical-session contract HLT-001. This is deliberately a formal
      # executable smoke instead of a reducer/unit test: it starts a real
      # AgentLoop process, commits one native file mutation, hard-kills that
      # process, opens the same SQLite from a replacement process, replays the
      # exact receipt, runs a real project test, and settles the same Objective
      # without manufacturing a second user turn.
      - name: Unattended long-task cross-process smoke
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $receipt = Join-Path $env:RUNNER_TEMP "unattended-long-task-smoke.json"
          cargo run --manifest-path src-tauri/Cargo.toml -- --unattended-long-task-smoke $receipt
          if ($LASTEXITCODE -ne 0) { throw "Unattended long-task smoke exited $LASTEXITCODE" }
          $smoke = Get-Content $receipt -Raw | ConvertFrom-Json
          if (-not $smoke.ok) { throw "Unattended long-task smoke did not report ok" }
          if ($smoke.scenario_id -ne "HLT-001") { throw "Unattended long-task smoke ran the wrong scenario" }
          if (-not $smoke.process_restart_observed) { throw "Replacement process was not observed" }
          if (-not $smoke.phase_one_was_hard_killed) { throw "The fault injection did not hard-kill phase one" }
          if (-not $smoke.same_objective) { throw "Recovery created a different Objective" }
          if ($smoke.user_message_count -ne 1) { throw "Recovery manufactured a user message" }
          if ($smoke.human_prompt_count -ne 0) { throw "Recoverable work requested human input" }
          if ($smoke.side_effect_receipt_count -ne 1) { throw "Mutation receipt was duplicated" }
          if ($smoke.replay_call_link_count -ne 2) { throw "Both provider Tool calls did not resolve to one receipt" }
          if ($smoke.objective_status -ne "completed") { throw "Recovered Objective did not complete" }
          if ($smoke.live_owner_count -ne 0) { throw "A live owner survived settlement" }
          if ($smoke.claimable_remediation_count -ne 0) { throw "A remediation remained claimable" }
          if ($smoke.provider_request_count -lt 5) { throw "The deterministic provider trajectory was incomplete" }
          if (-not $smoke.artifact_verified) { throw "The recovered workspace was not verified" }
          if (-not $smoke.cleanup_ok) { throw "The unattended smoke leaked isolated state" }
          Get-Content $receipt

      # E2E-002/E2E-003/E2E-007: use production SQLite admission, cancellation
      # and recovery exhaustion through distinct copies of this exact executable.
      - name: Historical session continue/stop/handback cross-process smoke
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $receipt = Join-Path $env:RUNNER_TEMP "history-session-smoke.json"
          cargo run --manifest-path src-tauri/Cargo.toml -- --history-session-smoke $receipt
          if ($LASTEXITCODE -ne 0) { throw "Historical session smoke exited $LASTEXITCODE" }
          $smoke = Get-Content $receipt -Raw | ConvertFrom-Json
          if (-not $smoke.ok) { throw "Historical session smoke did not report ok" }
          if (@($smoke.scenario_ids) -notcontains "E2E-002") { throw "Historical continue scenario was not exercised" }
          if (@($smoke.scenario_ids) -notcontains "E2E-003") { throw "Historical stop scenario was not exercised" }
          if (@($smoke.scenario_ids) -notcontains "E2E-007") { throw "Recovery handback scenario was not exercised" }
          if ($smoke.process_restart_count -lt 5) { throw "The smoke did not cross enough process restarts" }
          if (-not $smoke.stop_request_was_hard_killed) { throw "The durable stop fence was not followed by a hard kill" }
          if (-not $smoke.same_objective) { throw "Historical continue created a different Objective" }
          if ($smoke.continuation_objective_count -ne 1) { throw "Historical continue duplicated its Objective" }
          if ($smoke.continuation_user_message_count -ne 2) { throw "Historical continue lost or duplicated user input" }
          if ($smoke.continuation_bound_turn_count -ne 2) { throw "Historical continue did not bind both turns" }
          if (-not $smoke.history_outside_recent_page) { throw "The fixture did not exceed the recent message page" }
          if (-not $smoke.all_live_objectives_cancelled) { throw "Session stop left a live Objective" }
          if ($smoke.explicit_cancel_count -ne 3) { throw "Session stop did not cancel every owned Objective" }
          if ($smoke.claimable_remediation_count -ne 0) { throw "A cancelled remediation remained claimable" }
          if (-not $smoke.second_restart_stayed_cancelled) { throw "A cancelled Objective revived after the second restart" }
          if (-not $smoke.handback_survived_two_restarts) { throw "A handed-back turn revived after restart" }
          if (-not $smoke.cleanup_ok) { throw "Historical session smoke leaked isolated state" }
          Get-Content $receipt

      # The browser CLI may report an action error with exit code 0. Exercise
      # the real binary and prove the native manager detects that output and
      # removes its lease instead of leaving a headless browser daemon behind.
      - name: Browser session lifecycle smoke
        id: browser_smoke
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          # The runner has Chrome preinstalled but nobody at the keyboard, so
          # the headed default would open a window no one can use. This is the
          # only place the override is set; the app itself stays headed, since
          # a user completing a 2FA sign-in needs to see it.
          CODEFACTORY_BROWSER_HEADLESS: "1"
        run: |
          $receipt = Join-Path $env:RUNNER_TEMP "browser-session-smoke.json"
          cargo run --manifest-path src-tauri/Cargo.toml -- --browser-session-smoke $receipt
          if ($LASTEXITCODE -ne 0) { throw "Browser session smoke exited $LASTEXITCODE" }
          $smoke = Get-Content $receipt -Raw | ConvertFrom-Json
          # These four are the leak defence and stay exactly as loud as they
          # were. The smoke retries a browser that would not *start* — an
          # unusable runner — and nothing else; a session that opened and then
          # misbehaved fails here on its first observation.
          if ($smoke.status -ne "passed") { throw "Browser session smoke did not pass" }
          if (-not $smoke.snapshot_ok) { throw "Browser session smoke did not capture a snapshot" }
          if (-not $smoke.failure_detected) { throw "CLI logical failure was not detected" }
          if (-not $smoke.lease_reclaimed_after_failure) { throw "Browser lease survived failure" }
          # A retry that rescued the run must not be silent, or the runner
          # problem it papered over becomes invisible instead of merely green.
          if ($smoke.launch_attempts -gt 1) {
            Write-Output "::warning::Browser smoke needed $($smoke.launch_attempts) launch attempts on this runner"
          }

      # The receipt is the only durable record of *why* this step ended the way
      # it did. Uploading it is what turns the next intermittent failure into
      # evidence rather than another investigation from an exit code alone.
      # `warn` rather than `error`: the smoke now writes a receipt on every path
      # it reaches, so a missing file means the binary never ran at all — which
      # the step above has already reported. A second red step would only add
      # noise, exactly as it did in run 30795455214.
      - name: Upload browser session smoke receipt
        if: ${{ !cancelled() && steps.browser_smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-session-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/browser-session-smoke.json
          if-no-files-found: warn
