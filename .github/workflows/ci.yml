name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  agent-bridge-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Harbor runtime
        run: python -m pip install --disable-pip-version-check harbor==0.15.0

      - name: Agent bridge and evaluation tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_*.py'

  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        run: pnpm exec tsc --noEmit

      # Frontend regression tests (Vitest + jsdom + React Testing Library).
      # Currently covers the stick-to-bottom scroll hook, which shipped
      # broken in v0.3.7 and v0.3.9 before tests existed.
      - name: Vitest
        run: pnpm test

      - name: Release workflow contract tests
        run: python -m unittest tests.test_release_workflow

      - name: Evolution workbench headless viewport gate
        run: pnpm test:evolution:headless
        env:
          CODEFACTORY_EVOLUTION_ARTIFACT_DIR: ${{ runner.temp }}/codefactory-evolution-headless

      - name: Upload evolution viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolution-workbench-headless-${{ runner.os }}
          path: ${{ runner.temp }}/codefactory-evolution-headless
          if-no-files-found: error

      - name: Resume journal headless viewport gate
        run: pnpm test:resume:headless
        env:
          CODEFACTORY_RESUME_ARTIFACT_DIR: ${{ runner.temp }}/codefactory-resume-headless

      - name: Upload resume journal viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-journal-headless-${{ runner.os }}
          path: ${{ runner.temp }}/codefactory-resume-headless
          if-no-files-found: error

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # Run the Rust test suite. New regressions like the v0.3.7
      # "old sessions won't open" bug land here as failing tests so we
      # catch them before tagging a release instead of after a user
      # reports it.
      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --quiet

      - name: Evolution executable closed-loop smoke
        shell: pwsh
        run: |
          $receipt = Join-Path $env:RUNNER_TEMP "evolution-smoke.json"
          cargo run --manifest-path src-tauri/Cargo.toml -- --evolution-smoke $receipt
          if ($LASTEXITCODE -ne 0) { throw "Evolution executable smoke exited $LASTEXITCODE" }
          $smoke = Get-Content $receipt -Raw | ConvertFrom-Json
          if ($smoke.status -ne "pass") { throw "Evolution smoke status was not pass" }
          if (-not $smoke.failed_eval_blocked_activation) { throw "Failed Eval did not block activation" }
          if ($smoke.eval_passed_count -ne $smoke.eval_required_count) { throw "Required Evals did not all pass" }
          if (-not $smoke.restart_reopen_observed) { throw "Evolution state was not verified after reopen" }
          if ($smoke.rollback_status -ne "rolled_back") { throw "Activation did not roll back" }
          if (-not $smoke.cleanup) { throw "Evolution smoke did not clean isolated state" }

      # Keystone slice 3: prove the packaged Windows binary can construct the
      # REAL AgentLoop headless (app: None) with the full tool surface — the
      # loader path #166 made fragile. Runs on the actual executable, not the
      # unit-test EXE, which is the safe place to exercise the headless seam.
      - name: Headless AgentLoop construction smoke
        shell: pwsh
        run: |
          $receipt = Join-Path $env:RUNNER_TEMP "headless-smoke.json"
          cargo run --manifest-path src-tauri/Cargo.toml -- --headless-smoke $receipt
          if ($LASTEXITCODE -ne 0) { throw "Headless smoke exited $LASTEXITCODE" }
          $smoke = Get-Content $receipt -Raw | ConvertFrom-Json
          if (-not $smoke.ok) { throw "Headless smoke did not report ok" }
          if ($smoke.app_handle -ne "none") { throw "Headless smoke ran with an AppHandle" }
          if ($smoke.tool_count -lt 1) { throw "Headless tool surface was empty" }
          if ($smoke.events_recorded -ne 1) { throw "Headless event sink did not record" }
