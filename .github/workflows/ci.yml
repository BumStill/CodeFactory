name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        run: pnpm exec tsc --noEmit

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # Run the Rust test suite. New regressions like the v0.3.7
      # "old sessions won't open" bug land here as failing tests so we
      # catch them before tagging a release instead of after a user
      # reports it.
      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --quiet
