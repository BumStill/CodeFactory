name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  agent-bridge-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Harbor runtime
        run: python -m pip install --disable-pip-version-check harbor==0.15.0

      - name: Agent bridge and evaluation tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_*.py'

  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        run: pnpm exec tsc --noEmit

      # Frontend regression tests (Vitest + jsdom + React Testing Library).
      # Currently covers the stick-to-bottom scroll hook, which shipped
      # broken in v0.3.7 and v0.3.9 before tests existed.
      - name: Vitest
        run: pnpm test

      - name: Release workflow contract tests
        run: python -m unittest tests.test_release_workflow

      - name: Evolution workbench headless viewport gate
        run: pnpm test:evolution:headless
        env:
          CODEFACTORY_EVOLUTION_ARTIFACT_DIR: ${{ runner.temp }}/codefactory-evolution-headless

      - name: Upload evolution viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolution-workbench-headless-${{ runner.os }}
          path: ${{ runner.temp }}/codefactory-evolution-headless
          if-no-files-found: error

      - name: Resume journal headless viewport gate
        run: pnpm test:resume:headless
        env:
          CODEFACTORY_RESUME_ARTIFACT_DIR: ${{ runner.temp }}/codefactory-resume-headless

      - name: Upload resume journal viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-journal-headless-${{ runner.os }}
          path: ${{ runner.temp }}/codefactory-resume-headless
          if-no-files-found: error

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # Run the Rust test suite. New regressions like the v0.3.7
      # "old sessions won't open" bug land here as failing tests so we
      # catch them before tagging a release instead of after a user
      # reports it.
      - name: Build Rust tests
        env:
          CARGO_TARGET_DIR: src-tauri/target
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-run --quiet

      - name: Diagnose and run Rust tests
        shell: pwsh
        env:
          CARGO_TARGET_DIR: src-tauri/target
        run: |
          $testExe = Get-ChildItem "$env:CARGO_TARGET_DIR/debug/deps/codefactory_lib-*.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $testExe) { throw "Rust test executable not found" }
          Write-Host "TEST_EXE=$($testExe.FullName)"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $dumpbin = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found through vswhere" }
          Write-Host "DUMPBIN=$dumpbin"
          & $dumpbin /dependents $testExe.FullName
          if ($LASTEXITCODE -ne 0) { throw "dumpbin dependents failed with $LASTEXITCODE" }
          $imports = & $dumpbin /imports $testExe.FullName
          if ($LASTEXITCODE -ne 0) { throw "dumpbin imports failed with $LASTEXITCODE" }
          $imports | Write-Host
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class NativeImportProbe {
            [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
            public static extern IntPtr LoadLibraryW(string path);
            [DllImport("kernel32.dll", SetLastError = true)]
            public static extern IntPtr GetProcAddress(IntPtr module, string name);
            [DllImport("kernel32.dll")]
            public static extern bool FreeLibrary(IntPtr module);
          }
          "@
          $currentDll = $null
          $missing = [System.Collections.Generic.List[string]]::new()
          foreach ($line in $imports) {
            if ($line -match '^    ([A-Za-z0-9_.-]+\.dll)$') {
              $currentDll = $Matches[1]
              continue
            }
            if ($currentDll -and $line -match '^\s+[0-9A-F]+\s+([A-Za-z_?@][^ ]*)$') {
              $symbol = $Matches[1]
              $module = [NativeImportProbe]::LoadLibraryW($currentDll)
              if ($module -eq [IntPtr]::Zero) {
                $missing.Add("DLL $currentDll failed to load: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())")
              } elseif ([NativeImportProbe]::GetProcAddress($module, $symbol) -eq [IntPtr]::Zero) {
                $missing.Add("ENTRY $currentDll!$symbol missing: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())")
              }
              if ($module -ne [IntPtr]::Zero) { [void][NativeImportProbe]::FreeLibrary($module) }
            }
          }
          Write-Host "--- Missing imports ---"
          $missing | ForEach-Object { Write-Host $_ }
          if ($missing.Count -gt 0) { throw "$($missing.Count) direct imports are unavailable" }
          $probeStarted = Get-Date
          & $testExe.FullName __codefactory_loader_probe_no_test__ --exact
          $probeExit = $LASTEXITCODE
          if ($probeExit -ne 0) {
            Start-Sleep -Seconds 2
            Write-Host "--- Windows loader events after probe ---"
            Get-WinEvent -FilterHashtable @{LogName="Application"; StartTime=$probeStarted} -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match "codefactory_lib|entry point|procedure|SideBySide|0xc0000139" } |
              Select-Object TimeCreated,ProviderName,Id,LevelDisplayName,Message |
              Format-List | Out-String -Width 4096 | Write-Host
            Get-WinEvent -FilterHashtable @{LogName="System"; StartTime=$probeStarted} -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match "codefactory_lib|entry point|procedure|SideBySide|0xc0000139" } |
              Select-Object TimeCreated,ProviderName,Id,LevelDisplayName,Message |
              Format-List | Out-String -Width 4096 | Write-Host
            throw "loader probe failed with $probeExit"
          }
          cargo test --manifest-path src-tauri/Cargo.toml --quiet

      - name: Evolution executable closed-loop smoke
        shell: pwsh
        run: |
          $receipt = Join-Path $env:RUNNER_TEMP "evolution-smoke.json"
          cargo run --manifest-path src-tauri/Cargo.toml -- --evolution-smoke $receipt
          if ($LASTEXITCODE -ne 0) { throw "Evolution executable smoke exited $LASTEXITCODE" }
          $smoke = Get-Content $receipt -Raw | ConvertFrom-Json
          if ($smoke.status -ne "pass") { throw "Evolution smoke status was not pass" }
          if (-not $smoke.failed_eval_blocked_activation) { throw "Failed Eval did not block activation" }
          if ($smoke.eval_passed_count -ne $smoke.eval_required_count) { throw "Required Evals did not all pass" }
          if (-not $smoke.restart_reopen_observed) { throw "Evolution state was not verified after reopen" }
          if ($smoke.rollback_status -ne "rolled_back") { throw "Activation did not roll back" }
          if (-not $smoke.cleanup) { throw "Evolution smoke did not clean isolated state" }
