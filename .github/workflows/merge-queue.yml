name: merge-queue

# U31 — Repository merge queue.
#
# Green, armed PRs queue and merge one at a time, in order, each verified
# against the combined state (latest main + the PRs ahead of it). Nobody updates
# a branch by hand.
#
# GitHub's native merge queue is unavailable to this personal-account repo
# (owner.type == "User"; GraphQL `repository.mergeQueue` is null), so this
# workflow drives the equivalent orchestrator (scripts/merge-queue.mjs).
#
# This workflow is deliberately NOT a required status check: it is a background
# merger, not a gate. Making it required would deadlock the queue. It does not
# add, remove, or weaken any check in ruleset `main-pr-and-ci-gate`; the
# orchestrator refuses to run (fail closed) if the live ruleset's required-check
# set or strict up-to-date policy ever drifts.
#
# The file is read from the DEFAULT BRANCH (workflow_run/schedule semantics), so
# a candidate PR cannot rewrite the queue to certify itself.

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

on:
  # M126: label changes are the wake signal. `labeled` arms a PR; `unlabeled`
  # lifts the queue's own `merge-queue: blocked` (2026-10-20 #768 sat idle 20+
  # min exactly on that event). Which labels actually drain is decided by
  # `scripts/merge-queue.mjs wake` below, so the rule stays unit-tested.
  #
  # Safety: `pull_request_target` runs the DEFAULT-branch tooling and never
  # checks out or executes PR code — the queue that merges a candidate is the
  # one on the trusted branch. No new permissions are granted here.
  pull_request_target:
    types: [labeled, unlabeled]
  schedule:
    - cron: "*/10 * * * *" # sweep the queue every 10 minutes
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan the queue without merging anything"
        type: boolean
        default: false
  workflow_run:
    # React shortly after the required-check workflows finish.
    workflows: [CI, governance-baseline, scenario-gate]
    types: [completed]

# One queue run at a time. Never cancel an in-flight run: a cancelled run could
# leave a merge in an unknown state.
concurrency:
  group: merge-queue
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

jobs:
  drain-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trusted queue tooling (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # M126: one tested predicate decides whether this event drains the queue.
      # A label change outside `merge-queue: *` stops here in seconds and never
      # touches the merge path.
      - name: Decide whether this event drains the queue
        id: wake
        env:
          QUEUE_WAKE_LABEL: ${{ github.event.label.name }}
        run: |
          node scripts/merge-queue.mjs wake \
            --event "$GITHUB_EVENT_NAME" \
            --label "$QUEUE_WAKE_LABEL"

      - name: Require a write token
        if: steps.wake.outputs.run == 'true'
        env:
          MERGE_QUEUE_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          test -n "$MERGE_QUEUE_TOKEN" || {
            echo "::error::merge queue needs a token with contents+pull-requests write"
            exit 1
          }

      - name: Verify the queue logic (unit tests)
        if: steps.wake.outputs.run == 'true'
        run: node --test scripts/merge-queue.test.mjs

      - name: Drain the queue (plan + merge share one snapshot)
        if: steps.wake.outputs.run == 'true'
        # M114/R8: `drain` first asks "is anything armed?" with ONE listing and
        # exits immediately when nothing is queued (most workflow_run sweeps),
        # then reads the ruleset once and reuses a single PR listing for both the
        # plan and the merge loop. Previously `plan` and `run` were two separate
        # processes, each re-listing every open PR + its check-runs, which alone
        # cost ~1000-1300 REST calls/hour on the same 5000/h user budget the
        # desktop app uses.
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/merge-queue.mjs drain --repo "$GITHUB_REPOSITORY" --dry-run
          else
            # M141: retain the trusted observer across early CI-completion wakes.
            # Recheck every 180s for at most 30 minutes; no extra webhook needed.
            node scripts/merge-queue.mjs drain --repo "$GITHUB_REPOSITORY" --watch
          fi
