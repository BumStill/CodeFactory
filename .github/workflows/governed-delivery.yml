name: governed-delivery

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

on:
  workflow_dispatch:

jobs:
  governed-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python tools/governance/validate_repo_governance_baseline.py
      - run: powershell -ExecutionPolicy Bypass -File tools/governance/check_repo_governance.ps1
      - run: python tools/governance/diagnose_release_latency.py --help
