name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Step 1: generate release notes from conventional commits ───────────────
  # We install git-cliff from its prebuilt binary (taiki-e/install-action)
  # instead of running orhun/git-cliff-action, whose Docker base image
  # (Debian buster) is EOL and breaks the apt-get build.
  changelog:
    runs-on: ubuntu-latest
    outputs:
      content: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        id: cliff
        shell: bash
        run: |
          git-cliff --latest --strip all -o RELEASE_NOTES.md
          {
            echo 'content<<RELEASE_NOTES_EOF'
            cat RELEASE_NOTES.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "---- preview ----"
          cat RELEASE_NOTES.md

  # ── Step 2: build Windows installer and publish release ───────────────────
  build-windows:
    runs-on: windows-latest
    needs: changelog
    # Belt-and-suspenders: GitHub sometimes drops the top-level `permissions:`
    # for jobs with `needs:` dependencies, causing tauri-action's
    # "create release" API call to fail with 403 ("Resource not accessible
    # by integration"). Declaring it again per-job is harmless and guarantees
    # the contents:write scope is in effect.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          # Bust the cache when the release profile changes, otherwise
          # version-bump commits frequently land in a cold cache.
          key: profile-release-ci

      # sccache caches compilation outputs across runs, even when Cargo.lock
      # changes (e.g. on every version bump). Combined with the rust-cache
      # above (which caches whole target/ when keys match), this gives us a
      # second tier of caching that's resilient to lockfile churn.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Get pnpm store path
        id: pnpm-cache
        shell: pwsh
        run: echo "store=$(pnpm store path)" >> $env:GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Route all rustc invocations through sccache so artifacts persist
          # across runs via GitHub Actions Cache.
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          # Disable incremental compilation — incompatible with sccache and
          # not useful in a fresh CI checkout anyway.
          CARGO_INCREMENTAL: "0"
          # Override `release` profile to optimise for CI build time instead
          # of binary size. We can't use `tauri build --profile release-ci`
          # because tauri 2's CLI doesn't expose --profile at the top level
          # (only via `-- --profile`, which gets mangled by pnpm). Env-var
          # overrides bypass the parser entirely. Trades ~1MB of binary size
          # for ~50% shorter compile time.
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_LTO: "false"
          # Sign the installer + emit latest.json so the in-app updater can
          # verify and download the new version. Keys generated locally via
          # `tauri signer generate`; private key stored as a repo secret.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CodeFactory ${{ github.ref_name }}'
          releaseBody: ${{ needs.changelog.outputs.content }}
          releaseDraft: false
          prerelease: false
