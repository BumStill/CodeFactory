name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Step 1: generate release notes from conventional commits ───────────────
  # We install git-cliff from its prebuilt binary (taiki-e/install-action)
  # instead of running orhun/git-cliff-action, whose Docker base image
  # (Debian buster) is EOL and breaks the apt-get build.
  changelog:
    runs-on: ubuntu-latest
    outputs:
      content: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        id: cliff
        shell: bash
        run: |
          git-cliff --latest --strip all -o RELEASE_NOTES.md
          {
            echo 'content<<RELEASE_NOTES_EOF'
            cat RELEASE_NOTES.md
            # Trailing newline if the file didn't end with one — otherwise
            # the delimiter line below gets concatenated onto the last
            # content line and GHA fails with "matching delimiter not found".
            [ -n "$(tail -c 1 RELEASE_NOTES.md)" ] && echo
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "---- preview ----"
          cat RELEASE_NOTES.md

  # ── Step 2: build Windows installer and publish release ───────────────────
  build-windows:
    runs-on: windows-latest
    needs: changelog
    # Belt-and-suspenders: GitHub sometimes drops the top-level `permissions:`
    # for jobs with `needs:` dependencies, causing tauri-action's
    # "create release" API call to fail with 403 ("Resource not accessible
    # by integration"). Declaring it again per-job is harmless and guarantees
    # the contents:write scope is in effect.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-registry-

      # Note: swatinem/rust-cache was removed here. Its key is hashed on
      # Cargo.lock; we bump Cargo.lock on every release tag, so the cache
      # always missed on restore and the post-job step still spent ~2.5 min
      # writing a fresh cache that the next release would also miss.
      # sccache below caches at the per-object level and *is* resilient to
      # Cargo.lock churn, so it's the right tool for this workflow.

      # sccache caches individual compilation outputs across runs, surviving
      # version-bump Cargo.lock churn. mozilla-actions/sccache-action is the
      # right tool here even though its install step takes ~90s — it's the
      # only sccache installer that also exports the ACTIONS_CACHE_URL /
      # ACTIONS_RUNTIME_TOKEN env vars sccache needs to talk to GHA's cache
      # backend. taiki-e/install-action would be faster to install but
      # sccache would then have no cache backend and silently degrade to
      # local-only mode — losing all cross-run benefit.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Get pnpm store path
        id: pnpm-cache
        shell: pwsh
        run: echo "store=$(pnpm store path)" >> $env:GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Route all rustc invocations through sccache so artifacts persist
          # across runs via GitHub Actions Cache.
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          # Disable incremental compilation — incompatible with sccache and
          # not useful in a fresh CI checkout anyway.
          CARGO_INCREMENTAL: "0"
          # crates.io downloads occasionally drop mid-transfer on CI runners
          # (schannel "server closed abruptly"); give cargo more retries.
          CARGO_NET_RETRY: "10"
          CODEFACTORY_BUILD_GIT_SHA: ${{ github.sha }}
          # Override `release` profile to optimise for CI build time instead
          # of binary size. We can't use `tauri build --profile release-ci`
          # because tauri 2's CLI doesn't expose --profile at the top level
          # (only via `-- --profile`, which gets mangled by pnpm). Env-var
          # overrides bypass the parser entirely. Trades ~1MB of binary size
          # for ~50% shorter compile time.
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_LTO: "false"
          # Sign the installer + emit latest.json so the in-app updater can
          # verify and download the new version. Keys generated locally via
          # `tauri signer generate`; private key stored as a repo secret.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CodeFactory ${{ github.ref_name }}'
          releaseBody: ${{ needs.changelog.outputs.content }}
          # Create as draft and KEEP it draft. The macOS job uploads to this
          # same release afterward, and GitHub's "Immutable Releases" policy
          # freezes a release's assets the moment it's published. The final
          # `finalize` job flips the draft off once BOTH platforms are up — so
          # there is intentionally no publish step here anymore.
          releaseDraft: true
          prerelease: false

      - name: Verify Windows release executable Evolution closed loop
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release" -Filter "codefactory.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "Windows release executable was not produced" }
          $receipt = Join-Path $env:RUNNER_TEMP "evolution-release-smoke.json"
          & $exe.FullName --evolution-smoke $receipt
          if ($LASTEXITCODE -ne 0) { throw "Evolution release smoke exited $LASTEXITCODE" }
          $smoke = Get-Content $receipt -Raw | ConvertFrom-Json
          if ($smoke.status -ne "pass") { throw "Evolution smoke status was not pass" }
          if ($smoke.build_git_sha -ne "${{ github.sha }}") { throw "Evolution smoke was not built from the release commit" }
          if (-not $smoke.failed_eval_blocked_activation) { throw "Failed Eval did not block activation" }
          if ($smoke.eval_passed_count -ne $smoke.eval_required_count) { throw "Required Evals did not all pass" }
          if (-not $smoke.restart_reopen_observed) { throw "Evolution state was not verified after reopen" }
          if ($smoke.rollback_status -ne "rolled_back") { throw "Activation did not roll back" }
          if (-not $smoke.cleanup) { throw "Evolution smoke did not clean isolated state" }
          Get-Content $receipt

  # ── Step 3: build the unsigned macOS (Apple Silicon) app + dmg ────────────
  # Runs AFTER build-windows so the draft release already exists; tauri-action
  # uploads the .app.tar.gz (+ .sig) and the .dmg into that same draft. The app
  # is unsigned — no Apple Developer ID / notarization — so Gatekeeper blocks it
  # on first launch; users right-click → Open (documented in the release notes).
  # The UPDATER artifacts are still Tauri-signed with the same key as Windows,
  # so in-app auto-updates work on macOS too.
  build-macos:
    runs-on: macos-latest          # macos-latest is Apple Silicon (arm64)
    needs: build-windows
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-macos-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-registry-macos-

      # Same rationale as the Windows job: sccache survives the per-release
      # Cargo.lock churn where a Cargo.lock-keyed rust-cache would always miss.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (macOS, unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_INCREMENTAL: "0"
          CARGO_NET_RETRY: "10"
          CODEFACTORY_BUILD_GIT_SHA: ${{ github.sha }}
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_LTO: "false"
          # Same updater key as Windows — signs the .app.tar.gz so the macOS
          # in-app updater can verify it. This is the Tauri UPDATER signature,
          # NOT Apple code-signing; the app itself ships unsigned/un-notarized.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          # Upload into the existing draft; keep it draft for `finalize`.
          releaseDraft: true
          prerelease: false
          # bundle.targets in tauri.conf.json is ["nsis"] (Windows); nsis is not
          # a macOS bundle, so override to the mac bundles for this build only.
          args: --target aarch64-apple-darwin --bundles app,dmg

      - name: Verify installed macOS release artifact
        shell: bash
        env:
          CODEFACTORY_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/codefactory-release-evidence
          CODEFACTORY_GUI_PROOF_TIER: released-artifact-gui
        run: |
          mkdir -p "$CODEFACTORY_RELEASE_EVIDENCE_DIR"
          DMG_PATH="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          if [ -z "$DMG_PATH" ]; then
            echo "::error::macOS DMG was not produced"
            exit 1
          fi
          scripts/verify-macos-release-artifact.sh "$DMG_PATH" "${GITHUB_REF_NAME#v}"

      - name: Upload installed release GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-gui-evidence
          path: ${{ runner.temp }}/codefactory-release-evidence
          if-no-files-found: error

  # ── Step 4: assemble the cross-platform updater manifest, then publish ────
  # Each build job uploaded its own latest.json, but neither carries the other
  # platform's entry. Rebuild ONE authoritative latest.json from the .sig assets
  # already on the release (windows + darwin), overwrite it, then flip the draft
  # off — the single publish point, after every asset is in place.
  finalize:
    runs-on: ubuntu-latest
    needs: [changelog, build-macos]
    permissions:
      contents: write
    steps:
      - name: Assemble latest.json (windows + darwin) and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ needs.changelog.outputs.content }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BASE="https://github.com/$REPO/releases/download/$TAG"

          # Discover the uploaded binary names on the (still-draft) release.
          gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[].name' > assets.txt
          echo "---- release assets ----"; cat assets.txt
          WIN_EXE=$(grep -E '_x64-setup\.exe$' assets.txt | head -1 || true)
          MAC_TGZ=$(grep -E '\.app\.tar\.gz$' assets.txt | head -1 || true)
          if [ -z "$WIN_EXE" ] || [ -z "$MAC_TGZ" ]; then
            echo "::error::expected both binaries (win='$WIN_EXE' mac='$MAC_TGZ')"; exit 1
          fi

          # The Tauri update signatures (.sig) sit next to each binary.
          gh release download "$TAG" --repo "$REPO" --pattern "${WIN_EXE}.sig" --output win.sig --clobber
          gh release download "$TAG" --repo "$REPO" --pattern "${MAC_TGZ}.sig" --output mac.sig --clobber
          WIN_SIG="$(cat win.sig)"
          MAC_SIG="$(cat mac.sig)"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"

          # darwin-aarch64 url points at the .app.tar.gz (the updater artifact),
          # NOT the .dmg (which is only the human download).
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --arg winsig "$WIN_SIG" --arg winurl "$BASE/$WIN_EXE" \
            --arg macsig "$MAC_SIG" --arg macurl "$BASE/$MAC_TGZ" \
            '{version:$version, notes:$notes, pub_date:$pub_date, platforms:{
               "windows-x86_64":      {signature:$winsig, url:$winurl},
               "windows-x86_64-nsis": {signature:$winsig, url:$winurl},
               "darwin-aarch64":      {signature:$macsig, url:$macurl}
             }}' > latest.json
          echo "---- latest.json ----"; cat latest.json

          gh release upload "$TAG" --repo "$REPO" latest.json --clobber
          # Re-assert the notes (the macOS build job may touch the release) and
          # publish — the single point where the draft flag is flipped off.
          gh release edit   "$TAG" --repo "$REPO" --draft=false --notes "$NOTES"
