name: Release

run-name: Release ${{ inputs.tag }}

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to build and publish"
        required: true
        type: string
      expected_head_sha:
        description: "Exact commit the release tag must resolve to"
        required: false
        default: ""
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── Step 1: generate release notes from conventional commits ───────────────
  # We install git-cliff from its prebuilt binary (taiki-e/install-action)
  # instead of running orhun/git-cliff-action, whose Docker base image
  # (Debian buster) is EOL and breaks the apt-get build.
  changelog:
    runs-on: ubuntu-latest
    outputs:
      content: ${{ steps.cliff.outputs.content }}
      authorized_tag_sha: ${{ steps.authorize.outputs.authorized_tag_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Require exact release tag head
        id: authorize
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ACTUAL_HEAD_SHA=$(git rev-parse HEAD)
          ACTUAL_TAG_SHA=$(git rev-parse "${TAG}^{commit}")
          AUTHORIZED_TAG_SHA="${EXPECTED_HEAD_SHA:-$ACTUAL_TAG_SHA}"
          if [ "$ACTUAL_HEAD_SHA" != "$AUTHORIZED_TAG_SHA" ] || [ "$ACTUAL_TAG_SHA" != "$AUTHORIZED_TAG_SHA" ]; then
            echo "::error::release tag resolved to $ACTUAL_HEAD_SHA, expected $EXPECTED_HEAD_SHA; build and publish were blocked"
            exit 1
          fi
          echo "authorized_tag_sha=$AUTHORIZED_TAG_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve previous published release for notes
        id: notes_base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          AUTHORIZED_TAG_SHA: ${{ steps.authorize.outputs.authorized_tag_sha }}
        run: |
          set -euo pipefail
          RELEASES=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json isDraft,isPrerelease,publishedAt,tagName)
          BASE_TAG=$(jq -r --arg tag "$TAG" \
            '[.[] | select(.isDraft == false and .isPrerelease == false and .tagName != $tag)] | sort_by(.publishedAt) | last | .tagName // empty' \
            <<< "$RELEASES")
          test -n "$BASE_TAG" || {
            echo "::error::release notes could not resolve the previous published release tag"
            exit 1
          }
          BASE_SHA=$(git rev-parse "${BASE_TAG}^{commit}")
          git merge-base --is-ancestor "$BASE_SHA" "$AUTHORIZED_TAG_SHA" || {
            echo "::error::previous published release tag $BASE_TAG is not an ancestor of $TAG"
            exit 1
          }
          echo "base_tag=$BASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Install git-cliff
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: git-cliff

      - name: Generate release notes
        id: cliff
        shell: bash
        env:
          BASE_TAG: ${{ steps.notes_base.outputs.base_tag }}
          TAG: ${{ inputs.tag }}
        run: |
          git-cliff "$BASE_TAG..$TAG" --strip all -o RELEASE_NOTES.md
          {
            echo 'content<<RELEASE_NOTES_EOF'
            cat RELEASE_NOTES.md
            # Trailing newline if the file didn't end with one — otherwise
            # the delimiter line below gets concatenated onto the last
            # content line and GHA fails with "matching delimiter not found".
            [ -n "$(tail -c 1 RELEASE_NOTES.md)" ] && echo
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "---- preview ----"
          cat RELEASE_NOTES.md

  # Create or reuse one draft before either platform uploads assets. Keeping
  # this separate lets Windows and macOS build in parallel without racing to
  # create the release.
  prepare-release:
    runs-on: ubuntu-latest
    needs: changelog
    outputs:
      tag_sha: ${{ steps.prepare.outputs.tag_sha }}
      scenario_base_tag: ${{ steps.scenario_base.outputs.base_tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.changelog.outputs.authorized_tag_sha }}
          fetch-depth: 0

      - name: Checkout trusted default-branch scenario policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: policy
          persist-credentials: false
          fetch-depth: 0

      - name: Require remote release tag to remain authorized
        env:
          TAG: ${{ inputs.tag }}
          AUTHORIZED_TAG_SHA: ${{ needs.changelog.outputs.authorized_tag_sha }}
        run: tools/release/require_authorized_tag.sh "$TAG" "$AUTHORIZED_TAG_SHA" "create the draft release"

      - name: Resolve previous released tag for scenario impact
        id: scenario_base
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          AUTHORIZED_TAG_SHA: ${{ needs.changelog.outputs.authorized_tag_sha }}
        run: |
          set -euo pipefail
          RELEASES=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json isDraft,isPrerelease,publishedAt,tagName)
          BASE_TAG=$(jq -r --arg tag "$TAG" \
            '[.[] | select(.isDraft == false and .isPrerelease == false and .tagName != $tag)] | sort_by(.publishedAt) | last | .tagName // empty' \
            <<< "$RELEASES")
          if [ -z "$BASE_TAG" ]; then
            echo "::error::scenario release gate could not resolve the previous published release tag"
            exit 1
          fi
          BASE_SHA="$(git rev-parse "${BASE_TAG}^{commit}")"
          test -n "$BASE_SHA" || {
            echo "::error::scenario release gate could not resolve the previous published release tag SHA"
            exit 1
          }
          git merge-base --is-ancestor "$BASE_SHA" "$AUTHORIZED_TAG_SHA" || {
            echo "::error::previous published release tag $BASE_TAG is not an ancestor of $TAG"
            exit 1
          }
          echo "base_tag=$BASE_TAG" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: scenario-gate-release
        run: >-
          python3 policy/tools/governance/run_scenario_harness_gate.py
          --stage release_artifact
          --repo .
          --policy-repo policy
          --base-ref ${{ steps.scenario_base.outputs.base_sha }}

      - name: Validate tag and prepare draft release
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ needs.changelog.outputs.content }}
          AUTHORIZED_TAG_SHA: ${{ needs.changelog.outputs.authorized_tag_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must match vX.Y.Z, got '$TAG'"
            exit 1
          fi

          TAG_SHA="$AUTHORIZED_TAG_SHA"
          if [ "$(git rev-parse HEAD)" != "$TAG_SHA" ] || [ "$(git rev-parse "${TAG}^{commit}")" != "$TAG_SHA" ]; then
            echo "::error::checkout/tag does not match the frozen authorized release SHA"
            exit 1
          fi
          echo "tag_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

          # GitHub's release-by-tag endpoint cannot find drafts, so inspect the
          # authenticated release list instead. The tag format was validated
          # above before interpolation into jq.
          RELEASE_STATE="$(gh api --paginate \
            "repos/$REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .draft")"
          RELEASE_STATE="${RELEASE_STATE:-missing}"
          case "$RELEASE_STATE" in
            true)
              echo "Reusing existing draft release $TAG"
              ;;
            false)
              echo "::error::release $TAG is already published; refusing to overwrite it"
              exit 1
              ;;
            missing)
              printf '%s\n' "$NOTES" > release-notes.md
              gh release create "$TAG" --repo "$REPO" --verify-tag --draft \
                --title "CodeFactory $TAG" --notes-file release-notes.md
              ;;
            *)
              echo "::error::unexpected release state '$RELEASE_STATE' for $TAG"
              exit 1
              ;;
          esac

  # ── Step 2: build Windows installer ───────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    needs: [changelog, prepare-release]
    outputs:
      setup_sha256: ${{ steps.pack.outputs.sha256 }}
      setup_name: ${{ steps.pack.outputs.name }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag_sha }}
          persist-credentials: false

      - name: Require remote release tag to remain authorized
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          AUTHORIZED_TAG_SHA: ${{ needs.prepare-release.outputs.tag_sha }}
        run: tools/release/require_authorized_tag.sh "$TAG" "$AUTHORIZED_TAG_SHA" "start the Windows build"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-registry-

      # Note: swatinem/rust-cache was removed here. Its key is hashed on
      # Cargo.lock; we bump Cargo.lock on every release tag, so the cache
      # always missed on restore and the post-job step still spent ~2.5 min
      # writing a fresh cache that the next release would also miss.
      # sccache below caches at the per-object level and *is* resilient to
      # Cargo.lock churn, so it's the right tool for this workflow.

      # sccache caches individual compilation outputs across runs, surviving
      # version-bump Cargo.lock churn. mozilla-actions/sccache-action is the
      # right tool here even though its install step takes ~90s — it's the
      # only sccache installer that also exports the ACTIONS_CACHE_URL /
      # ACTIONS_RUNTIME_TOKEN env vars sccache needs to talk to GHA's cache
      # backend. taiki-e/install-action would be faster to install but
      # sccache would then have no cache backend and silently degrade to
      # local-only mode — losing all cross-run benefit.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e326ebed976843c9932b3aa0e021c6f50310eb4 # v0.0.6

      - name: Get pnpm store path
        id: pnpm-cache
        shell: pwsh
        run: echo "store=$(pnpm store path)" >> $env:GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Recheck release tag immediately before uploading assets
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          AUTHORIZED_TAG_SHA: ${{ needs.prepare-release.outputs.tag_sha }}
        run: tools/release/require_authorized_tag.sh "$TAG" "$AUTHORIZED_TAG_SHA" "upload release assets"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Route all rustc invocations through sccache so artifacts persist
          # across runs via GitHub Actions Cache.
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          # Disable incremental compilation — incompatible with sccache and
          # not useful in a fresh CI checkout anyway.
          CARGO_INCREMENTAL: "0"
          # crates.io downloads occasionally drop mid-transfer on CI runners
          # (schannel "server closed abruptly"); give cargo more retries.
          CARGO_NET_RETRY: "10"
          CODEFACTORY_BUILD_GIT_SHA: ${{ needs.prepare-release.outputs.tag_sha }}
          # Override `release` profile to optimise for CI build time instead
          # of binary size. We can't use `tauri build --profile release-ci`
          # because tauri 2's CLI doesn't expose --profile at the top level
          # (only via `-- --profile`, which gets mangled by pnpm). Env-var
          # overrides bypass the parser entirely. Trades ~1MB of binary size
          # for ~50% shorter compile time.
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_LTO: "false"
        with:
          # Build only. The signing key is not available here; sign-updater
          # uploads the draft release after a separate approval.
          args: --config src-tauri/tauri.release-unsigned.json

      - name: Recheck release tag immediately after the build
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          AUTHORIZED_TAG_SHA: ${{ needs.prepare-release.outputs.tag_sha }}
        run: tools/release/require_authorized_tag.sh "$TAG" "$AUTHORIZED_TAG_SHA" "keep the Windows build on the authorized tag"

      - name: Package unsigned Windows updater
        id: pack
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*_x64-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "Windows installer was not produced" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          Copy-Item $exe.FullName "$env:RUNNER_TEMP/windows-setup.exe"
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned Windows updater
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-unsigned-updater
          path: ${{ runner.temp }}/windows-setup.exe
          if-no-files-found: error

      - name: Verify Windows release executable Evolution closed loop
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release" -Filter "codefactory.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "Windows release executable was not produced" }
          $receipt = Join-Path $env:RUNNER_TEMP "evolution-release-smoke.json"
          # Tauri's Windows binary uses the GUI subsystem. Invoking it with `&`
          # returns before PowerShell receives an exit code, leaving
          # `$LASTEXITCODE` empty even when the executable writes a passing
          # receipt. Start-Process gives us a real process handle and waits for
          # the exact release binary to finish.
          $process = Start-Process -FilePath $exe.FullName `
            -ArgumentList @("--evolution-smoke", $receipt) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Evolution release smoke exited $($process.ExitCode)" }
          $smoke = Get-Content $receipt -Raw | ConvertFrom-Json
          if ($smoke.status -ne "pass") { throw "Evolution smoke status was not pass" }
          if ($smoke.build_git_sha -ne "${{ needs.prepare-release.outputs.tag_sha }}") { throw "Evolution smoke was not built from the release commit" }
          if (-not $smoke.failed_eval_blocked_activation) { throw "Failed Eval did not block activation" }
          if ($smoke.eval_passed_count -ne $smoke.eval_required_count) { throw "Required Evals did not all pass" }
          if (-not $smoke.restart_reopen_observed) { throw "Evolution state was not verified after reopen" }
          if ($smoke.rollback_status -ne "rolled_back") { throw "Activation did not roll back" }
          if (-not $smoke.cleanup) { throw "Evolution smoke did not clean isolated state" }
          Get-Content $receipt

      - name: Verify Windows release executable unattended long task
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release" -Filter "codefactory.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "Windows release executable was not produced" }
          $receipt = Join-Path $env:RUNNER_TEMP "unattended-long-task-release-smoke.json"
          $process = Start-Process -FilePath $exe.FullName `
            -ArgumentList @("--unattended-long-task-smoke", $receipt) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Unattended release smoke exited $($process.ExitCode)" }
          $smoke = Get-Content $receipt -Raw | ConvertFrom-Json
          if (-not $smoke.ok) { throw "Unattended release smoke did not report ok" }
          if ($smoke.scenario_id -ne "HLT-001") { throw "Unattended release smoke ran the wrong scenario" }
          if ($smoke.build_git_sha -ne "${{ needs.prepare-release.outputs.tag_sha }}") { throw "Unattended smoke was not built from the release commit" }
          if (-not $smoke.process_restart_observed) { throw "Replacement process was not observed" }
          if (-not $smoke.phase_one_was_hard_killed) { throw "The release smoke did not inject a hard kill" }
          if (-not $smoke.same_objective) { throw "Release recovery created a different Objective" }
          if ($smoke.user_message_count -ne 1) { throw "Release recovery manufactured a user message" }
          if ($smoke.human_prompt_count -ne 0) { throw "Release recovery requested human input" }
          if ($smoke.side_effect_receipt_count -ne 1) { throw "Release recovery duplicated a mutation receipt" }
          if ($smoke.replay_call_link_count -ne 2) { throw "Release Tool calls did not converge on one receipt" }
          if ($smoke.objective_status -ne "completed") { throw "Release Objective did not resume to completion" }
          if ($smoke.provider_request_count -lt 5) { throw "Release provider trajectory was incomplete" }
          if (-not $smoke.legacy_incident_converged_to_failed) { throw "Release did not converge a legacy suspended Objective to the failed terminal" }
          if ($smoke.convergence_notice_count -ne 1) { throw "Release failed terminal did not publish exactly one summary" }
          if ($smoke.incident_status -ne "resolved") { throw "Release left the legacy incident open" }
          if ($smoke.legacy_convergence_provider_requests -ne 0) { throw "Release legacy convergence performed provider work" }
          if (-not $smoke.session_order_preserved) { throw "Release startup convergence reordered the session" }
          if ($smoke.second_restart_mutations -ne 0) { throw "Release restart mutated settled state" }
          if ($smoke.live_owner_count -ne 0) { throw "Release smoke left a live owner" }
          if ($smoke.claimable_remediation_count -ne 0) { throw "Release smoke left claimable remediation" }
          if (-not $smoke.artifact_verified) { throw "Release smoke did not verify the workspace" }
          if (-not $smoke.cleanup_ok) { throw "Release smoke leaked isolated state" }
          Get-Content $receipt

      - name: Verify Windows release executable browser session lifecycle
        shell: pwsh
        env:
          CODEFACTORY_BROWSER_HEADLESS: "1"
        run: |
          $exe = Get-ChildItem "src-tauri/target/release" -Filter "codefactory.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "Windows release executable was not produced" }
          $receipt = Join-Path $env:RUNNER_TEMP "browser-session-release-smoke.json"
          $process = Start-Process -FilePath $exe.FullName `
            -ArgumentList @("--browser-session-smoke", $receipt) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Browser session release smoke exited $($process.ExitCode)" }
          $smoke = Get-Content $receipt -Raw | ConvertFrom-Json
          if ($smoke.status -ne "passed") { throw "Browser session release smoke did not pass" }
          if (-not $smoke.snapshot_ok) { throw "Release browser session did not capture a snapshot" }
          if (-not $smoke.failure_detected) { throw "Release browser session did not observe the injected failure" }
          if (-not $smoke.lease_reclaimed_after_failure) { throw "Release browser lease survived failure" }
          if (-not $smoke.same_objective -or -not $smoke.replacement_session_is_new) { throw "Release browser recovery changed Objective or reused the failed session" }
          if (-not $smoke.replacement_session_reclaimed -or -not $smoke.recovery_lease_reclaimed) { throw "Release browser recovery leaked the replacement session or lease" }
          if ($smoke.recovery_budget_attempts -ne 1 -or -not $smoke.objective_completed) { throw "Release browser recovery did not converge exactly once" }
          Get-Content $receipt

      - name: Verify Windows release executable previous-to-current update reconciliation
        shell: pwsh
        env:
          REPO: ${{ github.repository }}
          PREVIOUS_TAG: ${{ needs.prepare-release.outputs.scenario_base_tag }}
        run: |
          $exe = Get-ChildItem "src-tauri/target/release" -Filter "codefactory.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "Windows release executable was not produced" }
          if (-not $env:PREVIOUS_TAG) { throw "Previous release tag is unavailable" }
          $manifestUrl = "https://github.com/$env:REPO/releases/download/$env:PREVIOUS_TAG/latest.json"
          $previous = Invoke-RestMethod -Uri $manifestUrl
          if (-not $previous.version) { throw "Previous public manifest has no version" }
          if ($previous.build_git_sha -notmatch '^[0-9a-f]{40}$') { throw "Previous public manifest has no exact build SHA" }
          $receipt = Join-Path $env:RUNNER_TEMP "update-upgrade-release-smoke.json"
          $process = Start-Process -FilePath $exe.FullName `
            -ArgumentList @("--update-upgrade-smoke", $receipt, $previous.version, $previous.build_git_sha) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Update upgrade release smoke exited $($process.ExitCode)" }
          $smoke = Get-Content $receipt -Raw | ConvertFrom-Json
          if ($smoke.status -ne "pass" -or $smoke.scenario_id -ne "E2E-006") { throw "Update upgrade release smoke did not pass E2E-006" }
          if ($smoke.current_build -ne "${{ needs.prepare-release.outputs.tag_sha }}") { throw "Update upgrade smoke was not built from the release commit" }
          if ($smoke.previous_build -ne $previous.build_git_sha) { throw "Update fixture did not use the previous public build" }
          if (-not $smoke.database_reopened) { throw "Update fixture did not cross the restart boundary" }
          if ($smoke.first_observation -ne "applied" -or $smoke.second_observation -ne "applied") { throw "Update receipt was not idempotently reconciled" }
          if ($smoke.update_receipt_count -ne 1) { throw "Update reconciliation duplicated its receipt" }
          if ($smoke.historical_objective_count -ne 1) { throw "Historical objective was lost during update reconciliation" }
          if (-not $smoke.same_update_objective) { throw "Update reconciliation changed Objective identity" }
          Get-Content $receipt

      - name: Verify Windows release executable DeliveryRun recovery
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release" -Filter "codefactory.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "Windows release executable was not produced" }
          $receipt = Join-Path $env:RUNNER_TEMP "delivery-recovery-release-smoke.json"
          $process = Start-Process -FilePath $exe.FullName `
            -ArgumentList @("--delivery-recovery-smoke", $receipt) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Delivery recovery release smoke exited $($process.ExitCode)" }
          $smoke = Get-Content $receipt -Raw | ConvertFrom-Json
          if (-not $smoke.ok) { throw "Delivery recovery release smoke did not report ok" }
          if ($smoke.scenario_id -ne "E2E-011") { throw "Release ran the wrong delivery recovery scenario" }
          if ($smoke.build_git_sha -ne "${{ needs.prepare-release.outputs.tag_sha }}") { throw "Delivery recovery smoke was not built from the release commit" }
          if (-not $smoke.process_restart_observed) { throw "Release smoke did not observe the replacement process" }
          if (-not $smoke.post_commit_owner_hard_killed) { throw "Release smoke did not inject the commit-window hard kill" }
          if (-not $smoke.pre_ref_owner_hard_killed) { throw "Release smoke did not inject the intent-before-ref hard kill" }
          if (-not $smoke.same_delivery_run) { throw "Release recovery changed DeliveryRun identity" }
          if (-not $smoke.exact_receipted_head_reconciled) { throw "Release did not reconcile the exact receipted head" }
          if ($smoke.identity_revision_count -ne 1) { throw "Release revised delivery identity more than once" }
          if (-not $smoke.canonical_parent_reconciled) { throw "Release could not reconcile the canonical PR parent" }
          if ($smoke.canonical_parent_mutation_count -ne 0) { throw "Release canonical-parent observation issued a mutation" }
          if (-not $smoke.foreign_identity_failed_closed) { throw "Release foreign identity did not converge to the failed terminal" }
          if (-not $smoke.claim_epoch_plateau) { throw "Release delivery claim epoch did not plateau" }
          if ($smoke.objective_failed_event_count -ne 1) { throw "Release objective failure event was not singular" }
          if ($smoke.recovery_parked_event_count -ne 0) { throw "Release emitted a retired parked incident" }
          if ($smoke.duplicate_remote_write_count -ne 0) { throw "Release recovery duplicated a remote mutation" }
          if (-not $smoke.remote_head_unchanged) { throw "Release foreign recovery changed the remote" }
          if ($smoke.user_message_count -ne 1) { throw "Release recovery manufactured or lost user input" }
          if ($smoke.human_prompt_count -ne 0) { throw "Release recovery requested human input" }
          if (-not $smoke.cleanup_ok) { throw "Release delivery recovery leaked isolated state" }
          Get-Content $receipt

      - name: Verify Windows release executable historical session restart
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release" -Filter "codefactory.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "Windows release executable was not produced" }
          $receipt = Join-Path $env:RUNNER_TEMP "history-session-release-smoke.json"
          $process = Start-Process -FilePath $exe.FullName `
            -ArgumentList @("--history-session-smoke", $receipt) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Historical session release smoke exited $($process.ExitCode)" }
          $smoke = Get-Content $receipt -Raw | ConvertFrom-Json
          if (-not $smoke.ok) { throw "Historical session release smoke did not report ok" }
          if ($smoke.build_git_sha -ne "${{ needs.prepare-release.outputs.tag_sha }}") { throw "Historical session smoke was not built from the release commit" }
          if (@($smoke.scenario_ids) -notcontains "E2E-002") { throw "Release omitted the historical continue scenario" }
          if (@($smoke.scenario_ids) -notcontains "E2E-003") { throw "Release omitted the historical stop scenario" }
          if (@($smoke.scenario_ids) -notcontains "E2E-007") { throw "Release omitted the recovery incident scenario" }
          if (-not $smoke.stop_request_was_hard_killed) { throw "Release did not hard-kill the durable stop owner" }
          if (-not $smoke.same_objective) { throw "Release historical continue changed Objective identity" }
          if (-not $smoke.all_live_objectives_cancelled) { throw "Release session stop left a live Objective" }
          if ($smoke.claimable_remediation_count -ne 0) { throw "Release left claimable cancellation recovery" }
          if (-not $smoke.second_restart_stayed_cancelled) { throw "Release cancellation revived after the second restart" }
          if (-not $smoke.failed_terminal_survived_two_restarts) { throw "Release failed terminal was revived after restart" }
          if (-not $smoke.cleanup_ok) { throw "Release historical session smoke leaked isolated state" }
          Get-Content $receipt

      - name: Verify Windows release executable browser extension lifecycle
        shell: pwsh
        run: |
          # E2E-008: the same loopback lifecycle oracle the PR gate runs, but
          # against the exact release executable, so a release that touches the
          # extension bridge carries exact-artifact proof.
          $exe = Get-ChildItem "src-tauri/target/release" -Filter "codefactory.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "Windows release executable was not produced" }
          $receipt = Join-Path $env:RUNNER_TEMP "browser-extension-lifecycle-release.json"
          $process = Start-Process -FilePath $exe.FullName `
            -ArgumentList @("--browser-extension-lifecycle-smoke", $receipt) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Extension lifecycle release smoke exited $($process.ExitCode)" }
          $smoke = Get-Content $receipt -Raw | ConvertFrom-Json
          foreach ($field in @('ok', 'old_generation_cancelled', 'half_open_evicted', 'same_session', 'cleanup_ok')) {
            if ($smoke.$field -ne $true) { throw "Release lifecycle oracle failed: $field" }
          }
          if ($smoke.duplicate_command_count -ne 0) { throw "Release duplicated an extension command" }
          if ($smoke.human_prompt_count -ne 0) { throw "Release lifecycle smoke prompted a human" }
          Get-Content $receipt

  # ── Step 3: build the macOS (Apple Silicon) app + dmg ─────────────────────
  # Runs in parallel with Windows after prepare-release creates the draft;
  # tauri-action uploads the .app.tar.gz (+ .sig) and the .dmg. The updater
  # archive remains Tauri-signed with the same key as Windows so in-app
  # updates can verify it. Apple Developer ID/notarization is an optional
  # hardening track and must not block this established compatibility release.
  build-macos:
    runs-on: macos-latest          # macos-latest is Apple Silicon (arm64)
    needs: [changelog, prepare-release]
    outputs:
      updater_sha256: ${{ steps.pack.outputs.sha256 }}
      updater_name: ${{ steps.pack.outputs.name }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag_sha }}
          persist-credentials: false

      - name: Require remote release tag to remain authorized
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          AUTHORIZED_TAG_SHA: ${{ needs.prepare-release.outputs.tag_sha }}
        run: tools/release/require_authorized_tag.sh "$TAG" "$AUTHORIZED_TAG_SHA" "start the macOS build"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-macos-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-registry-macos-

      # Same rationale as the Windows job: sccache survives the per-release
      # Cargo.lock churn where a Cargo.lock-keyed rust-cache would always miss.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e326ebed976843c9932b3aa0e021c6f50310eb4 # v0.0.6

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Recheck release tag immediately before uploading assets
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          AUTHORIZED_TAG_SHA: ${{ needs.prepare-release.outputs.tag_sha }}
        run: tools/release/require_authorized_tag.sh "$TAG" "$AUTHORIZED_TAG_SHA" "upload release assets"

      - name: Build Tauri app (macOS compatibility channel)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_INCREMENTAL: "0"
          CARGO_NET_RETRY: "10"
          CODEFACTORY_BUILD_GIT_SHA: ${{ needs.prepare-release.outputs.tag_sha }}
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_LTO: "false"
        with:
          # bundle.targets in tauri.conf.json is ["nsis"] (Windows); nsis is not
          # a macOS bundle, so override to the mac bundles for this build only.
          # Updater archives are packed below and signed in sign-updater.
          args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.release-unsigned.json

      - name: Recheck release tag immediately after uploading assets
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          AUTHORIZED_TAG_SHA: ${{ needs.prepare-release.outputs.tag_sha }}
        run: tools/release/require_authorized_tag.sh "$TAG" "$AUTHORIZED_TAG_SHA" "keep the macOS build on the authorized tag"

      - name: Package unsigned macOS updater archive
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -type d -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "::error::macOS app bundle was not produced"
            exit 1
          fi
          DIR="$(dirname "$APP")"
          BASE="$(basename "$APP")"
          ARCHIVE="$DIR/${BASE}.tar.gz"
          tar -czf "$ARCHIVE" -C "$DIR" "$BASE"
          HASH="$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')"
          cp "$ARCHIVE" "$RUNNER_TEMP/macos-updater.tar.gz"
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ARCHIVE")" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned macOS updater
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-unsigned-updater
          path: ${{ runner.temp }}/macos-updater.tar.gz
          if-no-files-found: error

      - name: Verify installed macOS release artifact
        shell: bash
        env:
          CODEFACTORY_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/codefactory-release-evidence
          CODEFACTORY_BROWSER_CHROME_ATTACH_RECEIPT: ${{ runner.temp }}/codefactory-release-evidence/browser-chrome-attach-smoke.json
          CODEFACTORY_GUI_PROOF_TIER: released-artifact-gui
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_BUILD_SHA: ${{ needs.prepare-release.outputs.tag_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$CODEFACTORY_RELEASE_EVIDENCE_DIR"
          DMG_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          UPDATER_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          DMG_COUNT="$(find "$DMG_DIR" -type f -name '*.dmg' | wc -l | tr -d ' ')"
          UPDATER_COUNT="$(find "$UPDATER_DIR" -type f -name '*.app.tar.gz' | wc -l | tr -d ' ')"
          if [ "$DMG_COUNT" != "1" ] || [ "$UPDATER_COUNT" != "1" ]; then
            echo "::error::expected one macOS DMG and one updater archive, found dmg=$DMG_COUNT updater=$UPDATER_COUNT"
            exit 1
          fi
          DMG_PATH="$(find "$DMG_DIR" -type f -name '*.dmg' -print -quit)"
          UPDATER_ARCHIVE="$(find "$UPDATER_DIR" -type f -name '*.app.tar.gz' -print -quit)"
          scripts/verify-macos-release-artifact.sh \
            "$DMG_PATH" "${RELEASE_TAG#v}" "$EXPECTED_BUILD_SHA" "$UPDATER_ARCHIVE"

      - name: Upload installed release GUI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release-gui-evidence
          path: ${{ runner.temp }}/codefactory-release-evidence
          if-no-files-found: error

  # ── Step 3b: sign updater artifacts in a job that does not build code ────
  # The signing key exists only in this job's sign step, and only after the
  # release-signing environment is approved. This workflow does not approve it.
  sign-updater:
    runs-on: ubuntu-latest
    needs: [prepare-release, build-windows, build-macos]
    if: startsWith(inputs.tag, 'v')
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag_sha }}
          persist-credentials: false

      - name: Download unsigned updater artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-unsigned-updater'
          path: unsigned

      - name: Require artifact hashes to match the build jobs
        shell: bash
        env:
          WINDOWS_SHA: ${{ needs.build-windows.outputs.setup_sha256 }}
          MACOS_SHA: ${{ needs.build-macos.outputs.updater_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, sys
          expected = {
              "unsigned/windows-unsigned-updater/windows-setup.exe": os.environ["WINDOWS_SHA"],
              "unsigned/macos-unsigned-updater/macos-updater.tar.gz": os.environ["MACOS_SHA"],
          }
          for path, want in expected.items():
              file = pathlib.Path(path)
              if not file.is_file():
                  sys.exit(f"missing unsigned artifact: {path}")
              digest = hashlib.sha256(file.read_bytes()).hexdigest()
              if digest != want:
                  sys.exit(f"hash mismatch for {path}")
              print(f"ok {path} {digest}")
          PY

      - name: Install pinned Tauri CLI without lifecycle scripts
        run: npm install --ignore-scripts --no-save --no-package-lock @tauri-apps/cli@2.12.4

      - name: Sign updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npx --no-install tauri signer sign \
            -k "$TAURI_SIGNING_PRIVATE_KEY" \
            -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            unsigned/windows-unsigned-updater/windows-setup.exe \
            unsigned/macos-unsigned-updater/macos-updater.tar.gz

      - name: Verify signatures with the repository public key
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign
          python3 - <<'PY'
          import base64, json, pathlib, subprocess, sys
          config = json.loads(pathlib.Path("src-tauri/tauri.conf.json").read_text())
          pubkey = base64.b64decode(config["plugins"]["updater"]["pubkey"])
          key_path = pathlib.Path("updater.pub")
          key_path.write_bytes(pubkey)
          files = [
              "unsigned/windows-unsigned-updater/windows-setup.exe",
              "unsigned/macos-unsigned-updater/macos-updater.tar.gz",
          ]
          for path in files:
              sig = pathlib.Path(path + ".sig")
              if not sig.is_file():
                  sys.exit(f"missing signature: {sig}")
              subprocess.run(["minisign", "-Vm", path, "-x", path + ".sig", "-p", str(key_path)], check=True)
          print("updater signatures match the repository public key")
          PY

      - name: Require remote release tag to remain authorized
        env:
          TAG: ${{ inputs.tag }}
          AUTHORIZED_TAG_SHA: ${{ needs.prepare-release.outputs.tag_sha }}
        run: tools/release/require_authorized_tag.sh "$TAG" "$AUTHORIZED_TAG_SHA" "upload signed updater artifacts"

      - name: Upload signed updater artifacts to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          WIN_NAME: ${{ needs.build-windows.outputs.setup_name }}
          MAC_NAME: ${{ needs.build-macos.outputs.updater_name }}
        run: |
          set -euo pipefail
          cp unsigned/windows-unsigned-updater/windows-setup.exe "$WIN_NAME"
          cp unsigned/windows-unsigned-updater/windows-setup.exe.sig "$WIN_NAME.sig"
          cp unsigned/macos-unsigned-updater/macos-updater.tar.gz "$MAC_NAME"
          cp unsigned/macos-unsigned-updater/macos-updater.tar.gz.sig "$MAC_NAME.sig"
          gh release upload "$TAG" --repo "$REPO" "$WIN_NAME" "$WIN_NAME.sig" "$MAC_NAME" "$MAC_NAME.sig" --clobber

      - name: Require remote release tag to remain authorized after upload
        env:
          TAG: ${{ inputs.tag }}
          AUTHORIZED_TAG_SHA: ${{ needs.prepare-release.outputs.tag_sha }}
        run: tools/release/require_authorized_tag.sh "$TAG" "$AUTHORIZED_TAG_SHA" "keep signed updater artifacts on the authorized tag"

  # ── Step 4: assemble the cross-platform updater manifest, then publish ────
  # Build jobs intentionally skip latest.json to avoid a concurrent same-name
  # asset race. Build ONE authoritative manifest from the .sig assets already
  # on the release (windows + darwin), then flip the draft off — the single
  # publish point, after every asset is in place.
  finalize:
    runs-on: ubuntu-latest
    needs: [changelog, prepare-release, build-windows, build-macos, sign-updater]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag_sha }}
          fetch-depth: 0

      - name: Require remote release tag to remain authorized
        env:
          TAG: ${{ inputs.tag }}
          AUTHORIZED_TAG_SHA: ${{ needs.prepare-release.outputs.tag_sha }}
        run: tools/release/require_authorized_tag.sh "$TAG" "$AUTHORIZED_TAG_SHA" "publish the release"

      - name: Assemble latest.json (windows + darwin) and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ needs.changelog.outputs.content }}
          BUILD_GIT_SHA: ${{ needs.prepare-release.outputs.tag_sha }}
          AUTHORIZED_TAG_SHA: ${{ needs.prepare-release.outputs.tag_sha }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BASE="https://github.com/$REPO/releases/download/$TAG"
          if [[ ! "$BUILD_GIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release build identity must be a full lowercase Git SHA"
            exit 1
          fi

          # Discover the uploaded binary names on the (still-draft) release.
          gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[].name' > assets.txt
          echo "---- release assets ----"; cat assets.txt
          WIN_EXE=$(grep -E '_x64-setup\.exe$' assets.txt | head -1 || true)
          MAC_TGZ=$(grep -E '\.app\.tar\.gz$' assets.txt | head -1 || true)
          if [ -z "$WIN_EXE" ] || [ -z "$MAC_TGZ" ]; then
            echo "::error::expected both binaries (win='$WIN_EXE' mac='$MAC_TGZ')"; exit 1
          fi

          # The Tauri update signatures (.sig) sit next to each binary.
          gh release download "$TAG" --repo "$REPO" --pattern "${WIN_EXE}.sig" --output win.sig --clobber
          gh release download "$TAG" --repo "$REPO" --pattern "${MAC_TGZ}.sig" --output mac.sig --clobber
          WIN_SIG="$(cat win.sig)"
          MAC_SIG="$(cat mac.sig)"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"

          # darwin-aarch64 url points at the .app.tar.gz (the updater artifact),
          # NOT the .dmg (which is only the human download).
          jq -n \
            --arg version "$VERSION" \
            --arg build_git_sha "$BUILD_GIT_SHA" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --arg winsig "$WIN_SIG" --arg winurl "$BASE/$WIN_EXE" \
            --arg macsig "$MAC_SIG" --arg macurl "$BASE/$MAC_TGZ" \
            '{version:$version, build_git_sha:$build_git_sha, notes:$notes, pub_date:$pub_date, platforms:{
               "windows-x86_64":      {signature:$winsig, url:$winurl},
               "windows-x86_64-nsis": {signature:$winsig, url:$winurl},
               "darwin-aarch64":      {signature:$macsig, url:$macurl}
             }}' > latest.json
          echo "---- latest.json ----"; cat latest.json

          # Everything above — asset discovery, signature downloads, manifest
          # assembly — is slow enough for a tag to move underneath it, and the
          # two mutations that follow cannot be undone. Recheck immediately
          # before them, not just at the top of the job.
          "$GITHUB_WORKSPACE/tools/release/require_authorized_tag.sh" "$TAG" "$AUTHORIZED_TAG_SHA" "publish the release"

          gh release upload "$TAG" --repo "$REPO" latest.json --clobber
          # Re-assert the notes (the macOS build job may touch the release) and
          # publish — the single point where the draft flag is flipped off.
          gh release edit   "$TAG" --repo "$REPO" --draft=false --notes "$NOTES"

  # Step 5: verify the asset users actually download after publication. This
  # runs on a fresh hosted macOS machine, so local screen lock/sleep state is
  # irrelevant and build-directory artifacts cannot satisfy the gate.
  verify-published-macos:
    runs-on: macos-latest
    needs: [finalize, prepare-release]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag_sha }}

      - name: Download published macOS DMG
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_DIR="$RUNNER_TEMP/codefactory-published-release"
          mkdir -p "$RELEASE_DIR"
          VERSION="${TAG#v}"
          DMG_PATH="$RELEASE_DIR/CodeFactory_${VERSION}_aarch64.dmg"
          UPDATER_ARCHIVE="$RELEASE_DIR/CodeFactory_aarch64.app.tar.gz"
          LATEST_MANIFEST="$RELEASE_DIR/latest.json"
          PUBLIC_BASE="https://github.com/$REPO/releases/download/$TAG"
          # Remove any inherited token so this proves the asset is available
          # through the same anonymous URL an end user receives.
          env -u GH_TOKEN curl \
            --fail --location --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 3 \
            --output "$DMG_PATH" \
            "$PUBLIC_BASE/CodeFactory_${VERSION}_aarch64.dmg"
          env -u GH_TOKEN curl \
            --fail --location --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 3 \
            --output "$UPDATER_ARCHIVE" \
            "$PUBLIC_BASE/CodeFactory_aarch64.app.tar.gz"
          env -u GH_TOKEN curl \
            --fail --location --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 3 \
            --output "$LATEST_MANIFEST" \
            "$PUBLIC_BASE/latest.json"

      - name: Verify published macOS release artifact
        shell: bash
        env:
          CODEFACTORY_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/codefactory-published-release-evidence
          CODEFACTORY_GUI_PROOF_TIER: published-release-artifact-gui
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          DMG_DIR="$RUNNER_TEMP/codefactory-published-release"
          mkdir -p "$CODEFACTORY_RELEASE_EVIDENCE_DIR"
          {
            DMG_COUNT="$(find "$DMG_DIR" -type f -name '*.dmg' | wc -l | tr -d ' ')"
            UPDATER_COUNT="$(find "$DMG_DIR" -type f -name '*.app.tar.gz' | wc -l | tr -d ' ')"
            if [ "$DMG_COUNT" != "1" ] || [ "$UPDATER_COUNT" != "1" ]; then
              echo "::error::expected one published arm64 DMG and updater archive, found dmg=$DMG_COUNT updater=$UPDATER_COUNT"
              exit 1
            fi
            DMG_PATH="$(find "$DMG_DIR" -type f -name '*.dmg' -print -quit)"
            UPDATER_ARCHIVE="$(find "$DMG_DIR" -type f -name '*.app.tar.gz' -print -quit)"
            LATEST_MANIFEST="$DMG_DIR/latest.json"
            if [ ! -f "$LATEST_MANIFEST" ]; then
              echo "::error::published latest.json is missing"
              exit 1
            fi
            EXPECTED_BUILD_SHA="$(git rev-parse HEAD)"
            scripts/verify-macos-release-artifact.sh \
              "$DMG_PATH" "${RELEASE_TAG#v}" "$EXPECTED_BUILD_SHA" \
              "$UPDATER_ARCHIVE" "$LATEST_MANIFEST"
          } 2>&1 | tee "$CODEFACTORY_RELEASE_EVIDENCE_DIR/verification.log"

      - name: Upload published release GUI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-published-release-gui-evidence-${{ inputs.tag }}
          path: ${{ runner.temp }}/codefactory-published-release-evidence
          if-no-files-found: error
