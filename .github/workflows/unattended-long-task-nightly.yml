name: Unattended Long Task Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

concurrency:
  group: unattended-long-task-nightly
  cancel-in-progress: false

jobs:
  historical-scenario-matrix:
    name: Historical scenario matrix (HLT-001 HLT-002 HLT-003 HLT-004 HLT-005 CXD-001 CXD-002 E2E-011)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Validate synthetic historical scenario catalog
        run: node --test scripts/unattended-long-task-contract.test.mjs scripts/history-session-smoke-contract.test.mjs scripts/delivery-recovery-smoke-contract.test.mjs

      # Full workspace coverage is intentional here. Required PR CI splits
      # workspace members for readable verdicts; nightly proves the aggregate
      # dependency graph and every Rust target referenced by the catalog.
      - name: Run historical scenario unit and integration matrix
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --quiet

      - name: Run formal cross-process hard-kill scenario
        id: unattended_smoke
        shell: pwsh
        run: |
          $receipt = Join-Path $env:RUNNER_TEMP "unattended-long-task-nightly.json"
          cargo run --manifest-path src-tauri/Cargo.toml -- --unattended-long-task-smoke $receipt
          if ($LASTEXITCODE -ne 0) { throw "Unattended nightly smoke exited $LASTEXITCODE" }
          $smoke = Get-Content $receipt -Raw | ConvertFrom-Json
          if (-not $smoke.ok) { throw "Unattended nightly smoke did not report ok" }
          if ($smoke.scenario_id -ne "HLT-001") { throw "Nightly ran the wrong formal scenario" }
          if (-not $smoke.phase_one_was_hard_killed) { throw "Nightly did not inject a hard kill" }
          if (-not $smoke.process_restart_observed) { throw "Nightly did not observe replacement process" }
          if (-not $smoke.same_objective) { throw "Nightly recovery changed Objective identity" }
          if ($smoke.user_message_count -ne 1) { throw "Nightly manufactured a user message" }
          if ($smoke.human_prompt_count -ne 0) { throw "Nightly requested human participation" }
          if ($smoke.side_effect_receipt_count -ne 1) { throw "Nightly duplicated a side effect" }
          if ($smoke.replay_call_link_count -ne 2) { throw "Nightly replay did not converge" }
          if ($smoke.objective_status -ne "completed") { throw "Nightly Objective did not complete" }
          if ($smoke.live_owner_count -ne 0) { throw "Nightly left a live owner" }
          if ($smoke.claimable_remediation_count -ne 0) { throw "Nightly left claimable remediation" }
          if (-not $smoke.artifact_verified) { throw "Nightly did not verify the workspace" }
          if (-not $smoke.cleanup_ok) { throw "Nightly leaked isolated state" }
          Get-Content $receipt

      - name: Upload unattended receipt
        if: ${{ !cancelled() && steps.unattended_smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: unattended-long-task-nightly-${{ github.run_id }}
          path: ${{ runner.temp }}/unattended-long-task-nightly.json
          if-no-files-found: error

      - name: Delivery recovery hard-kill and bounded-park smoke
        id: delivery_recovery_smoke
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $receipt = Join-Path $env:RUNNER_TEMP "delivery-recovery-nightly.json"
          cargo run --manifest-path src-tauri/Cargo.toml -- --delivery-recovery-smoke $receipt
          if ($LASTEXITCODE -ne 0) { throw "Delivery recovery nightly smoke exited $LASTEXITCODE" }
          $smoke = Get-Content $receipt -Raw | ConvertFrom-Json
          if (-not $smoke.ok) { throw "Delivery recovery nightly smoke did not report ok" }
          if ($smoke.scenario_id -ne "E2E-011") { throw "Nightly ran the wrong delivery scenario" }
          if (-not $smoke.post_commit_owner_hard_killed) { throw "Nightly did not inject the commit-window hard kill" }
          if (-not $smoke.pre_ref_owner_hard_killed) { throw "Nightly did not inject the intent-before-ref hard kill" }
          if (-not $smoke.exact_receipted_head_reconciled) { throw "Nightly did not reconcile the receipted head" }
          if (-not $smoke.canonical_parent_reconciled) { throw "Nightly did not reconcile the canonical PR parent" }
          if ($smoke.canonical_parent_mutation_count -ne 0) { throw "Nightly canonical-parent observation issued a mutation" }
          if (-not $smoke.foreign_identity_parked) { throw "Nightly did not park foreign identity drift" }
          if (-not $smoke.claim_epoch_plateau) { throw "Nightly delivery claim epoch did not plateau" }
          if ($smoke.duplicate_remote_write_count -ne 0) { throw "Nightly duplicated a remote mutation" }
          if ($smoke.user_message_count -ne 1) { throw "Nightly manufactured or lost user input" }
          if ($smoke.human_prompt_count -ne 0) { throw "Nightly requested human participation" }
          if (-not $smoke.cleanup_ok) { throw "Nightly delivery recovery leaked isolated state" }
          Get-Content $receipt

      - name: Upload delivery recovery receipt
        if: ${{ !cancelled() && steps.delivery_recovery_smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: delivery-recovery-nightly-${{ github.run_id }}
          path: ${{ runner.temp }}/delivery-recovery-nightly.json
          if-no-files-found: error

      - name: Historical session restart smoke
        id: history_session_smoke
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $receipt = Join-Path $env:RUNNER_TEMP "history-session-nightly.json"
          cargo run --manifest-path src-tauri/Cargo.toml -- --history-session-smoke $receipt
          if ($LASTEXITCODE -ne 0) { throw "Historical session nightly smoke exited $LASTEXITCODE" }
          $smoke = Get-Content $receipt -Raw | ConvertFrom-Json
          if (-not $smoke.ok) { throw "Historical session nightly smoke did not report ok" }
          if (-not $smoke.stop_request_was_hard_killed) { throw "Nightly did not hard-kill the durable stop owner" }
          if (-not $smoke.same_objective) { throw "Nightly historical continue changed Objective identity" }
          if (-not $smoke.all_live_objectives_cancelled) { throw "Nightly session stop left a live Objective" }
          if ($smoke.claimable_remediation_count -ne 0) { throw "Nightly left claimable cancellation recovery" }
          if (-not $smoke.second_restart_stayed_cancelled) { throw "Nightly cancellation revived after the second restart" }
          if (-not $smoke.system_incident_survived_two_restarts) { throw "Nightly system incident became runnable after restart" }
          if (-not $smoke.cleanup_ok) { throw "Nightly historical session smoke leaked isolated state" }
          Get-Content $receipt

      - name: Upload historical session receipt
        if: ${{ !cancelled() && steps.history_session_smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: history-session-nightly-${{ github.run_id }}
          path: ${{ runner.temp }}/history-session-nightly.json
          if-no-files-found: error

  # The unattended long-task smoke is the L2 evidence for HLT-001/E2E-001, and
  # it ran only on windows-latest — in required PR CI and in the nightly job
  # above. E2E-001's own gap said so: "PR 门禁只跑 Windows 进程 smoke，macOS 侧
  # 同一路径未自动化". This runs the same exact-binary smoke on macOS, and
  # asserts every receipt field rather than trusting the exit code.
  macos-unattended-smoke:
    name: macOS unattended long-task smoke (E2E-001)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Unattended long task smoke (macOS)
        id: unattended_smoke_macos
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/unattended-long-task-nightly-macos.json"
          cargo run --manifest-path src-tauri/Cargo.toml -- --unattended-long-task-smoke "$receipt"
          test -s "$receipt"
          assert() {
            local expr="$1" message="$2"
            if [ "$(jq -r "$expr" "$receipt")" != "true" ]; then
              echo "::error::$message"
              jq . "$receipt"
              exit 1
            fi
          }
          assert '.ok'                               'macOS unattended smoke did not report ok'
          assert '.scenario_id == "HLT-001"'         'macOS nightly ran the wrong formal scenario'
          assert '.phase_one_was_hard_killed'        'macOS nightly did not inject a hard kill'
          assert '.process_restart_observed'         'macOS nightly did not observe a replacement process'
          assert '.same_objective'                   'macOS recovery changed Objective identity'
          assert '.user_message_count == 1'          'macOS nightly manufactured a user message'
          assert '.human_prompt_count == 0'          'macOS nightly requested human participation'
          assert '.side_effect_receipt_count == 1'   'macOS nightly duplicated a side effect'
          assert '.objective_status == "completed"'  'macOS Objective did not complete'
          assert '.live_owner_count == 0'            'macOS nightly left a live owner'
          assert '.claimable_remediation_count == 0' 'macOS nightly left claimable remediation'
          assert '.cleanup_ok'                       'macOS nightly leaked isolated state'
          jq . "$receipt"

      - name: Upload macOS unattended receipt
        if: ${{ !cancelled() && steps.unattended_smoke_macos.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: unattended-long-task-nightly-macos-${{ github.run_id }}
          path: ${{ runner.temp }}/unattended-long-task-nightly-macos.json
          if-no-files-found: error
