name: governance-baseline

on:
  pull_request:
  push:

jobs:
  governance-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/governance/validate_repo_governance_baseline.py
