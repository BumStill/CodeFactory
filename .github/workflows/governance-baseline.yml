name: governance-baseline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  governance-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history so the rules validator can diff vs base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - run: python tools/governance/validate_repo_governance_baseline.py
      - name: Validate scenario test governance for pull requests
        if: github.event_name == 'pull_request'
        env:
          SCENARIO_TEST_EVENT_PATH: ${{ github.event_path }}
          SCENARIO_TEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tools/governance/validate_scenario_test_governance.py --ci
      - name: Validate scenario registry after merge
        if: github.event_name == 'push'
        run: python tools/governance/validate_scenario_test_governance.py
      - name: Enforce governance rules manifest (docs/governance/rules.yml)
        env:
          GOVERNANCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/governance/check_governance_rules.py
