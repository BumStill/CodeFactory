name: Auto Release

# RELEASE CADENCE PRINCIPLE — merge continuously, release adaptively.
# This does NOT run on every merge. A release is cut on demand
# (workflow_dispatch) or once daily (schedule), batching everything merged
# since the last tag into ONE versioned release — and only when there's a
# user-facing change (feat/fix) to ship. See docs/principles/release-cadence.md.
#
# With healthy gates and infrastructure, the daily schedule is the normal
# maximum wait (≤24h for anything releasable), not the only exit and not a
# promise of a version per day:
# a schedule tick with no feat/fix produces no release. Severity and size
# choose the speed, carried in a commit trailer any tool can read:
#   Release-Urgency: immediate  → merge operator dispatches right after merge
#   Release-Urgency: hold       → blocks cuts until a maintainer explicitly
#                                  allows the reviewed batch
# Absent (the default) means "rides the next scheduled cut".
# The trailer is a decision signal; it deliberately does not add a merge trigger.
#
# It then determines the version slot from ALL commits since the last tag,
# bumps the version files on an automation branch, opens a PR, waits for the
# same required checks as every other change, then tags the merged commit and
# dispatches release.yml. Running Release on the default branch lets consecutive
# versions share GitHub cache scope while every build still checks out the
# immutable tag. Bump commits ("chore: bump version to …") are excluded so they
# can never themselves cause a release.

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: "Exact main commit authorized to start this release batch"
        type: string
        required: false
        default: ""
      force:
        description: "Cut a release even with no feat/fix since the last tag"
        type: boolean
        default: false
      allow_guarded_batch:
        description: "Release a fully reviewed batch containing hold/invalid urgency trailers"
        type: boolean
        default: false
  schedule:
    - cron: "0 1 * * *" # daily 01:00 UTC — batches the day's merges into one release

permissions:
  contents: read
  actions: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release-token-preflight:
    runs-on: ubuntu-latest
    outputs:
      authorized_head_sha: ${{ steps.authorize.outputs.authorized_head_sha }}
    steps:
      - name: Require exact dispatched main head
        id: authorize
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          DISPATCHED_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$EXPECTED_HEAD_SHA" ] && [ "$DISPATCHED_HEAD_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::release dispatch expected $EXPECTED_HEAD_SHA but GitHub bound the run to $DISPATCHED_HEAD_SHA; no release mutation was allowed"
            exit 1
          fi
          echo "authorized_head_sha=$DISPATCHED_HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Require release automation PAT
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          test -n "$RELEASE_PAT" || {
            echo "::error::RELEASE_PAT is required for CI-triggering version PRs and tag pushes"
            exit 1
          }

  release:
    needs: release-token-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-token-preflight.outputs.authorized_head_sha }}
          fetch-depth: 0
          # RELEASE_PAT may create/update the version PR and therefore trigger
          # its required checks. It has no ruleset bypass and cannot push main.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Refuse a batch whose main branch advanced after dispatch
        env:
          AUTHORIZED_HEAD_SHA: ${{ needs.release-token-preflight.outputs.authorized_head_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD_SHA"
          test "$(git rev-parse origin/main)" = "$AUTHORIZED_HEAD_SHA" || {
            echo "::error::main advanced after release authorization; re-dispatch from the new exact head before any release mutation"
            exit 1
          }

      - name: Quiesce open version PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          BRANCH="automation/release-next"
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            if ! gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto; then
              echo "Existing version PR #$PR did not have an active auto-merge request, or cancellation returned an error; verifying live state"
            fi
            AUTO_MERGE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
              --json autoMergeRequest \
              --jq 'if .autoMergeRequest == null then "null" else "enabled" end')
            if [ "$AUTO_MERGE" != "null" ]; then
              echo "::error::Version PR auto-merge is still enabled after cancellation"
              exit 1
            fi
            echo "Paused existing version PR #$PR before replanning"
          fi
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::main advanced during release startup; rerun from the latest main"
            exit 1
          }

      - name: Verify main governance check is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only gate on governance-baseline (seconds), not full CI (minutes).
          # The PR already ran the full CI suite on the exact same code — the
          # squash merge to main cannot change its outcome. Requiring main CI
          # here just adds 6-8 minutes of dead wait per release.
          # The script looks the run up by exact SHA, retries transient API
          # errors with visible stderr, and still never infers green.
          set -euo pipefail
          tools/release/require_green_governance.sh "$(git rev-parse HEAD)"

      - name: Reconcile interrupted version release
        id: reconcile
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "recovered=false" >> "$GITHUB_OUTPUT"
          BRANCH="automation/release-next"
          PR_DATA=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" \
            --state merged --limit 20 --json number,mergedAt,mergeCommit \
            --jq 'sort_by(.mergedAt) | last // {}')
          PR=$(jq -r '.number // empty' <<< "$PR_DATA")
          if [ -z "$PR" ]; then
            echo "No previously merged guarded version PR to reconcile"
            exit 0
          fi

          MERGE_SHA=$(jq -r '.mergeCommit.oid // empty' <<< "$PR_DATA")
          test -n "$MERGE_SHA" || {
            echo "::error::Merged version PR #$PR has no merge SHA"
            exit 1
          }
          git fetch origin main --tags
          git merge-base --is-ancestor "$MERGE_SHA" origin/main || {
            echo "::error::Version PR merge $MERGE_SHA is not contained in origin/main"
            exit 1
          }
          VERSION=$(git show "$MERGE_SHA:package.json" | jq -r '.version')
          SUBJECT=$(git show -s --format=%s "$MERGE_SHA")
          [[ "$SUBJECT" =~ ^chore:\ bump\ version\ to\ $VERSION(\ \(#[0-9]+\))?$ ]] || {
            echo "::error::Latest $BRANCH merge is not a canonical version bump"
            exit 1
          }
          FILES=$(git diff-tree --no-commit-id --name-only -r "$MERGE_SHA" | sort)
          EXPECTED=$(printf '%s\n' package.json src-tauri/Cargo.lock \
            src-tauri/Cargo.toml src-tauri/tauri.conf.json | sort)
          test "$FILES" = "$EXPECTED" || {
            echo "::error::Version PR merge changed files outside the four version manifests"
            exit 1
          }

          CARGO_VERSION=$(git show "$MERGE_SHA:src-tauri/Cargo.toml" | \
            sed -n '0,/^version = /s/^version = "\([^"]*\)"/\1/p')
          TAURI_VERSION=$(git show "$MERGE_SHA:src-tauri/tauri.conf.json" | jq -r '.version')
          LOCK_VERSION=$(git show "$MERGE_SHA:src-tauri/Cargo.lock" | \
            awk '/^name = "codefactory"$/ { found=1; next } found && /^version = / { gsub(/^version = "|"$/, ""); print; found=0 }')
          test "$VERSION" = "$CARGO_VERSION" && \
            test "$VERSION" = "$TAURI_VERSION" && \
            test "$VERSION" = "$LOCK_VERSION" || {
            echo "::error::Recovered version PR has inconsistent version manifests"
            exit 1
          }
          TAG="v$VERSION"
          TAG_CREATED=false
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$MERGE_SHA" || {
              echo "::error::$TAG already points to a different commit"
              exit 1
            }
          else
            git tag "$TAG" "$MERGE_SHA"
            n=0
            until git push origin "$TAG"; do
              n=$((n + 1))
              if [ "$n" -ge 5 ]; then
                echo "::error::recovery push of $TAG failed after $n attempts"
                exit 1
              fi
              sleep $((n * 10))
            done
            TAG_CREATED=true
            echo "Recovered missing tag $TAG at $MERGE_SHA"
          fi

          # `gh release view` exits non-zero for TWO different situations: the
          # release genuinely does not exist (404), and "we could not ask"
          # (rate limit, network, revoked token). Collapsing both into "missing"
          # made a transient 403 read as a broken release: on 2026-08-04 this
          # step aborted with "Release v1.77.3 run succeeded but no published
          # release exists" while v1.77.3 was published, non-draft, with six
          # assets — the query had simply been rate-limited. Never let "I could
          # not check" masquerade as a fact about the world.
          read_release_state() {   # published | draft | missing | unknown
            local out status
            out=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft 2>&1)
            status=$?
            if [ "$status" -eq 0 ]; then
              if [ "$(jq -r '.isDraft' <<< "$out")" = "false" ]; then
                echo published
              else
                echo draft
              fi
              return 0
            fi
            if grep -qiE 'release not found|HTTP 404' <<< "$out"; then
              echo missing
              return 0
            fi
            echo "::warning::could not read release state for $TAG: $out" >&2
            echo unknown
          }

          RELEASE_STATE=unknown
          for attempt in 1 2 3; do
            RELEASE_STATE=$(read_release_state)
            [ "$RELEASE_STATE" != unknown ] && break
            sleep $((attempt * 20))
          done
          if [ "$RELEASE_STATE" = unknown ]; then
            # Report the real situation. Dispatching a duplicate release on a
            # guess would be worse than stopping, and claiming the release is
            # absent would be a lie.
            echo "::error::could not determine the release state of $TAG (API unavailable, likely transient). Re-run this workflow; nothing was changed."
            exit 1
          fi
          if [ "$RELEASE_STATE" = published ]; then
            echo "Published release $TAG already exists; reconciliation complete"
            exit 0
          fi

          RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml \
            --limit 100 --json displayTitle,status,conclusion)
          RUN=$(jq --arg title "Release $TAG" \
            '[.[] | select(.displayTitle == $title)][0] // {}' <<< "$RUNS")
          RUN_STATUS=$(jq -r '.status // "missing"' <<< "$RUN")
          RUN_CONCLUSION=$(jq -r '.conclusion // ""' <<< "$RUN")
          case "$RUN_STATUS" in
            requested|waiting|pending|queued|in_progress)
              echo "Release $TAG is already $RUN_STATUS; no duplicate dispatch"
              echo "recovered=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if [ "$RUN_CONCLUSION" = "success" ] && [ "$RELEASE_STATE" != "published" ]; then
            echo "::error::Release $TAG run succeeded but no published release exists"
            exit 1
          fi

          # A tag is immutable. If its release failed and main now contains a
          # new releasable fix, retrying the old source can never exercise that
          # fix. Keep the failed tag as an auditable tombstone and let the
          # normal planner cut the next patch from the current exact main.
          # `force` is the operator's explicit "cut from current main" — the
          # same override the planner below honours. Without it, a failed tag
          # followed only by a ci/chore repair (the v1.88.21 release-gate fix,
          # 2026-10-18) was retried from the old source forever.
          if [ "$RUN_CONCLUSION" = "failure" ]; then
            FIX_PLAN=$(python3 tools/release/plan_release.py --range "$TAG..HEAD" \
              --force "${{ github.event.inputs.force || 'false' }}")
            if [ "$(jq -r '.skip' <<< "$FIX_PLAN")" = "false" ]; then
              echo "Release $TAG failed and main contains a releasable fix; continuing with a new immutable patch tag"
              echo "abandoned_tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "recovered=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ "$TAG_CREATED" = true ] || [ "$RELEASE_STATE" != "published" ]; then
            TAG_SHA=$(git rev-parse "$TAG^{commit}")
            GH_TOKEN="$ACTIONS_TOKEN" gh workflow run release.yml \
              --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG" \
              -f expected_head_sha="$TAG_SHA"
            echo "Recovered missing Release dispatch for $TAG"
            echo "recovered=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version slot from commits since last tag
        id: slot
        if: steps.reconcile.outputs.recovered != 'true'
        run: |
          # Batch the whole window since the last tag — NOT just one commit.
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE="${LAST:+$LAST..}HEAD"
          # The policy lives in a tested script instead of duplicated shell
          # fragments. `force` only overrides the no-feat/fix rule; it can never
          # bypass a held or malformed batch by accident.
          python3 tools/release/plan_release.py \
            --range "$RANGE" \
            --force "${{ github.event.inputs.force }}" \
            --allow-guarded-batch "${{ github.event.inputs.allow_guarded_batch }}" \
            --github-output "$GITHUB_OUTPUT"

          SKIP=$(tail -n 6 "$GITHUB_OUTPUT" | sed -n 's/^skip=//p')
          REASON=$(tail -n 6 "$GITHUB_OUTPUT" | sed -n 's/^skip_reason=//p')
          if [ "$SKIP" = true ]; then
            echo "::warning::Release skipped for $RANGE: $REASON"
          fi
          echo "Range: $RANGE"

      - name: Setup Node.js
        if: steps.reconcile.outputs.recovered != 'true' && steps.slot.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Resolve next version
        id: ver
        if: steps.reconcile.outputs.recovered != 'true' && steps.slot.outputs.skip != 'true'
        run: |
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          CURRENT="${LAST#v}"
          IFS='.' read -r MAJ MIN PAT <<< "$CURRENT"
          SLOT="${{ steps.slot.outputs.slot }}"
          case "$SLOT" in
            major) NEW="$((MAJ+1)).0.0" ;;
            minor) NEW="$MAJ.$((MIN+1)).0" ;;
            patch) NEW="$MAJ.$MIN.$((PAT+1))" ;;
          esac
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW"    >> "$GITHUB_OUTPUT"
          echo "Last: $LAST  Slot: $SLOT  Next: v$NEW"

      - name: Bump version files
        if: steps.reconcile.outputs.recovered != 'true' && steps.slot.outputs.skip != 'true'
        env:
          NEW: ${{ steps.ver.outputs.version }}
        run: |
          # package.json
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version = '$NEW';
            fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
          "
          # src-tauri/Cargo.toml  (first [package] version line only)
          sed -i "0,/^version = \"[^\"]*\"/{s//version = \"$NEW\"/}" src-tauri/Cargo.toml
          # src-tauri/tauri.conf.json
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            c.version = '$NEW';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(c,null,2)+'\n');
          "
          # src-tauri/Cargo.lock — keep the committed lockfile in step with
          # Cargo.toml. We patch the [[package]] codefactory version line directly
          # (the line right after its `name =` line) rather than running
          # `cargo update`: this job sets up no Rust toolchain or registry index,
          # and a stray cargo could rewrite the lockfile format. A workspace
          # member carries no checksum, so this one-line replace is byte-for-byte
          # what cargo itself writes.
          sed -i '/^name = "codefactory"$/{n;s/^version = ".*"/version = "'"$NEW"'"/}' src-tauri/Cargo.lock
          # Fail fast if the lock didn't actually sync — never tag a release whose
          # lockfile disagrees with its manifests.
          grep -A1 '^name = "codefactory"$' src-tauri/Cargo.lock | grep -q "version = \"$NEW\"" || {
            echo "::error::Cargo.lock codefactory entry did not sync to $NEW"; exit 1;
          }

      - name: Open guarded version bump PR
        id: version_pr
        if: steps.reconcile.outputs.recovered != 'true' && steps.slot.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          NEW: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || {
            echo "::error::RELEASE_PAT is required to create a CI-triggering version PR"
            exit 1
          }
          BRANCH="automation/release-next"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json src-tauri/Cargo.lock
          git commit -m "chore: bump version to $NEW"
          HEAD_SHA=$(git rev-parse HEAD)

          REMOTE_SHA=$(git ls-remote --heads origin "refs/heads/$BRANCH" | awk '{print $1}')
          LEASE="--force-with-lease=refs/heads/$BRANCH:$REMOTE_SHA"
          n=0
          until git push "$LEASE" origin "HEAD:refs/heads/$BRANCH"; do
            ACTUAL_SHA=$(git ls-remote --heads origin "refs/heads/$BRANCH" | awk '{print $1}')
            if [ "$ACTUAL_SHA" = "$HEAD_SHA" ]; then
              echo "Push reached origin despite a transient client error"
              break
            fi
            if [ "$ACTUAL_SHA" != "$REMOTE_SHA" ]; then
              echo "::error::$BRANCH changed concurrently from ${REMOTE_SHA:-missing} to ${ACTUAL_SHA:-missing}"
              exit 1
            fi
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "::error::push of $BRANCH failed after $n attempts"
              exit 1
            fi
            echo "push of $BRANCH failed (attempt $n); retrying in $((n * 10))s"
            sleep $((n * 10))
          done

          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
                 --state open --json number --jq '.[0].number // empty')
          PR_BODY=$'Automated version bump for '"$TAG"$'. This PR must pass the same required checks as every other main change.\n\nScenario-Test: ALL\nREADME-Update: reviewed\nREADME-Update-Reason: Version manifest only; the evergreen README keeps version-neutral latest-release links.'
          if [ -z "$PR" ]; then
            PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "chore: bump version to $NEW" \
              --body "$PR_BODY")
            PR="${PR_URL##*/}"
          else
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" \
              --title "chore: bump version to $NEW" \
              --body "$PR_BODY"
          fi
          echo "pr_number=$PR" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Version PR #$PR opened for guarded checks at $HEAD_SHA"

      - name: Wait for guarded version bump merge
        id: version_merge
        timeout-minutes: 60
        if: steps.reconcile.outputs.recovered != 'true' && steps.slot.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          PR: ${{ steps.version_pr.outputs.pr_number }}
          EXPECTED_HEAD: ${{ steps.version_pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          # The six required checks this gate waits for. Kept explicit in the
          # workflow so the release gate and the repo ruleset can be compared by
          # reading (tests/test_github_main_gate.py), and passed to the
          # classifier so judgement lives in tested code rather than in shell.
          REQUIRED_CHECKS="governance-baseline agent-bridge-linux check-frontend check-rust check-rust-macos-security check-rust-unix docker-sandbox remote-real-app-gui scenario-gate-pr"
          MAX_INFRA_RETRIES=3
          RETRY_COUNTS='{}'
          INFRA_RETRIES=0
          GRACE_ROUNDS=0

          # Reading GitHub is an observation, not a verdict. On 2026-11-03 a
          # `HTTP 502: Bad Gateway` while polling became "the version PR
          # failed", and `set -e` killed the whole release (M223 R1). Retry a
          # bounded number of times with backoff, and report every attempt.
          gh_retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              echo "::warning::GitHub call failed (attempt $attempt/5): $*" >&2
              sleep $((attempt * 10))
            done
            return 1
          }

          observe_pr() {
            local out
            for attempt in 1 2 3 4 5; do
              if out=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
                         --json state,mergeStateStatus,mergeCommit,headRefOid,statusCheckRollup \
                         2>/dev/null); then
                printf '%s' "$out"
                return 0
              fi
              echo "::warning::could not read version PR #$PR (attempt $attempt/5); retrying with backoff" >&2
              sleep $((attempt * 10))
            done
            return 1
          }

          DEADLINE=$((SECONDS + 3600))
          for attempt in $(seq 1 360); do
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Infrastructure/required-check wait exhausted the 60 minute deadline"
              exit 1
            fi
            if ! DATA=$(observe_pr); then
              echo "::warning::version PR #$PR is unreadable right now ($attempt/360); keeping the release alive"
              sleep 20
              continue
            fi
            ACTUAL_HEAD=$(jq -r '.headRefOid' <<< "$DATA")
            if [ "$ACTUAL_HEAD" != "$EXPECTED_HEAD" ]; then
              echo "::error::Version PR #$PR head changed from $EXPECTED_HEAD to $ACTUAL_HEAD"
              exit 1
            fi
            STATE=$(jq -r '.state' <<< "$DATA")
            if [ "$STATE" = "MERGED" ]; then
              MERGE_SHA=$(jq -r '.mergeCommit.oid // empty' <<< "$DATA")
              test -n "$MERGE_SHA" || {
                echo "::error::Version PR merged without a merge SHA"
                exit 1
              }
              echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
              echo "Version PR #$PR merged at $MERGE_SHA"
              exit 0
            fi
            if [ "$STATE" = "CLOSED" ]; then
              echo "::error::Version PR #$PR closed without merging"
              exit 1
            fi

            # The rollup is passed through as-is; the classifier collapses it
            # to the newest attempt per check name (a rerun appends a second
            # check run for the same head SHA, and a superseded FAILURE must
            # never outvote the attempt that replaced it) and owns every other
            # judgement in this round (M223).
            ROLLUP=$(jq -c '[.statusCheckRollup[]?
                | {name: (.name // .context), conclusion: (.conclusion // ""),
                   startedAt: (.startedAt // ""), detailsUrl: (.detailsUrl // "")}]' <<< "$DATA")

            classify_round() {   # $1 = run/job evidence, $2 = rerunnable run ids, $3 = annotations
              jq -n --argjson checks "$ROLLUP" --argjson runs "$1" --argjson retry "$2" \
                    --argjson annotations "$3" \
                    --argjson required "$(jq -Rc 'split(" ") | map(select(length > 0))' \
                        <<< "$REQUIRED_CHECKS")" \
                    --argjson used 0 --argjson max "$MAX_INFRA_RETRIES" \
                '{checks: $checks, runs: $runs, retry_run_ids: $retry,
                  annotations: $annotations, required: $required,
                  infra_retries_used: $used, max_infra_retries: $max}' \
                | python3 tools/release/classify_ci_infra.py
            }

            # "All six green" stays the merge trigger, in the exact shape the
            # repo audit test pins (tests/test_release_workflow.py): the gate
            # may not quietly require fewer checks. Counting uses the newest
            # attempt per check name, so a stale duplicate cannot vote twice.
            SUCCESSES=$(jq -r --arg required "$REQUIRED_CHECKS" '[group_by(.name)[]
                | {latest: max_by(.startedAt)}
                | select(.latest.name as $name | $required | split(" ") | index($name))
                | select(.latest.conclusion == "SUCCESS")] | length' <<< "$ROLLUP")

            DECISION_JSON=$(classify_round '[]' '[]' '{}')
            DECISION=$(jq -r '.decision' <<< "$DECISION_JSON")

            if [ "$DECISION" != "merge" ] && [ "$DECISION" != "wait" ]; then
              if [ "$GRACE_ROUNDS" -gt 0 ]; then
                # A rerun was just requested; the rollup still carries the old
                # attempt. Observe, do not spend another retry on stale
                # evidence.
                GRACE_ROUNDS=$((GRACE_ROUNDS - 1))
                echo "Version PR #$PR is settling after an infrastructure rerun ($GRACE_ROUNDS grace round(s) left)"
                sleep 20
                continue
              fi

              # Something is red. Gather what actually failed so the classifier
              # can separate a GitHub hiccup (runner setup, action download, a
              # cancelled run) from a real red test. A failure to collect
              # evidence never becomes a verdict: the classifier stays
              # fail-closed and says so.
              RUN_JOBS="[]"
              RETRY_RUN_IDS="[]"
              if ! FAILING_RUNS=$(gh_retry gh run list --repo "$GITHUB_REPOSITORY" \
                     --commit "$EXPECTED_HEAD" --limit 50 \
                     --json databaseId,event,conclusion \
                     --jq '[.[] | select(.event == "pull_request")
                             | select(.conclusion == "failure" or .conclusion == "cancelled"
                                   or .conclusion == "timed_out" or .conclusion == "startup_failure")
                             | .databaseId] | .[]?'); then
                echo "::warning::could not list workflow runs for $EXPECTED_HEAD; red checks stay unclassified" >&2
                FAILING_RUNS=""
              fi
              for RUN_ID in $FAILING_RUNS; do
                RETRY_RUN_IDS=$(jq -c --argjson id "$RUN_ID" '. + [$id] | unique' <<< "$RETRY_RUN_IDS")
                if ! JOBS=$(gh_retry gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs); then
                  echo "::warning::could not read jobs of run $RUN_ID; its step evidence is missing" >&2
                  continue
                fi
                RUN_JOBS=$(jq -c --argjson id "$RUN_ID" --argjson jobs "$JOBS" \
                  '. + [{run_id: $id, jobs: $jobs}]' <<< "$RUN_JOBS")
              done

              # A job GitHub never placed has no failed step at all; its
              # check-run annotation ("The job was not acquired by Runner ...")
              # is the only evidence of why (M223 R2).
              ANNOTATIONS="{}"
              for CHECK in $(jq -r '.failed_checks[]' <<< "$DECISION_JSON"); do
                CHECK_ID=$(jq -r --arg c "$CHECK" \
                  '[.[] | select(.name == $c) | select(.startedAt | length > 0)]
                   | max_by(.startedAt) | .detailsUrl // empty
                   | try capture("jobs/(?<id>[0-9]+)").id // empty' <<< "$ROLLUP")
                if [ -z "$CHECK_ID" ]; then
                  continue
                fi
                if ! MESSAGES=$(gh_retry gh api \
                       "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_ID/annotations" \
                       --jq '[.[].message]'); then
                  echo "::warning::could not read annotations of $CHECK ($CHECK_ID)" >&2
                  continue
                fi
                ANNOTATIONS=$(jq -c --arg check "$CHECK" --argjson messages "$MESSAGES" \
                  '. + {($check): $messages}' <<< "$ANNOTATIONS")
              done

              DECISION_JSON=$(classify_round "$RUN_JOBS" "$RETRY_RUN_IDS" "$ANNOTATIONS")
              DECISION=$(jq -r '.decision' <<< "$DECISION_JSON")
            fi

            REASON=$(jq -r '.reason' <<< "$DECISION_JSON")
            MERGE_STATE=$(jq -r '.mergeStateStatus' <<< "$DATA")

            if [ "$MERGE_STATE" = "DIRTY" ]; then
              echo "::error::Version PR #$PR has merge conflicts"
              exit 1
            fi
            if [ "$MERGE_STATE" = "BEHIND" ]; then
              echo "::error::Version PR #$PR is behind main; refusing to expand an already planned release batch. Rerun Auto Release to replan from latest main."
              exit 1
            fi

            case "$DECISION" in
              merge|wait)
                ;;
              retry_infra)
                for CHECK in $(jq -r '.failed_checks[]' <<< "$DECISION_JSON"); do
                  USED=$(jq -r --arg c "$CHECK" '.[$c] // 0' <<< "$RETRY_COUNTS")
                  if [ "$USED" -ge "$MAX_INFRA_RETRIES" ]; then
                    echo "::error::Infrastructure failure on $CHECK persisted after $USED automatic retries"
                    exit 1
                  fi
                  RETRY_COUNTS=$(jq -c --arg c "$CHECK" '.[$c] = ((.[$c] // 0) + 1)' <<< "$RETRY_COUNTS")
                  echo "::warning::$CHECK infrastructure retry $((USED + 1))/$MAX_INFRA_RETRIES: $REASON"
                done
                INFRA_RETRIES=$((INFRA_RETRIES + 1))
                echo "::warning::$REASON -- rerunning failed jobs instead of failing the release"
                for RUN_ID in $(jq -r '.retry_run_ids[]' <<< "$DECISION_JSON"); do
                  if ! gh run rerun "$RUN_ID" --repo "$GITHUB_REPOSITORY" --failed; then
                    echo "::warning::rerun of $RUN_ID was rejected (already rerunning?); observing the next round" >&2
                  fi
                done
                GRACE_ROUNDS=3
                sleep 20
                continue
                ;;
              *)
                echo "::error::$REASON"
                exit 1
                ;;
            esac

            if [ "$SUCCESSES" -eq 9 ] && [ "$DECISION" = "merge" ]; then
              if gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash \
                   --auto --match-head-commit "$EXPECTED_HEAD"; then
                echo "All required checks passed; submitted guarded merge for version PR #$PR"
              else
                echo "::warning::guarded merge submission for version PR #$PR was rejected; the next round re-checks and retries"
              fi
              sleep 5
              continue
            fi
            echo "Version PR #$PR waiting ($attempt/360, state=$MERGE_STATE, required=$SUCCESSES/9, infra-retries=$INFRA_RETRIES): $REASON"
            sleep 20
          done
          echo "::error::Version PR #$PR did not merge within 60 minutes (infrastructure observations or required checks did not converge)"
          exit 1

      - name: Tag guarded merge and dispatch release build
        if: steps.reconcile.outputs.recovered != 'true' && steps.slot.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          MERGE_SHA: ${{ steps.version_merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git merge-base --is-ancestor "$MERGE_SHA" origin/main || {
            echo "::error::Version PR merge $MERGE_SHA is not contained in origin/main"
            exit 1
          }

          EXPECTED_VERSION="${TAG#v}"
          SUBJECT=$(git show -s --format=%s "$MERGE_SHA")
          [[ "$SUBJECT" =~ ^chore:\ bump\ version\ to\ $EXPECTED_VERSION(\ \(#[0-9]+\))?$ ]] || {
            echo "::error::Tag candidate is not the canonical version bump for $EXPECTED_VERSION"
            exit 1
          }
          FILES=$(git diff-tree --no-commit-id --name-only -r "$MERGE_SHA" | sort)
          EXPECTED_FILES=$(printf '%s\n' package.json src-tauri/Cargo.lock \
            src-tauri/Cargo.toml src-tauri/tauri.conf.json | sort)
          test "$FILES" = "$EXPECTED_FILES" || {
            echo "::error::Tag candidate changed files outside the four version manifests"
            exit 1
          }

          PACKAGE_VERSION=$(git show "$MERGE_SHA:package.json" | jq -r '.version')
          CARGO_VERSION=$(git show "$MERGE_SHA:src-tauri/Cargo.toml" | \
            sed -n '0,/^version = /s/^version = "\([^"]*\)"/\1/p')
          TAURI_VERSION=$(git show "$MERGE_SHA:src-tauri/tauri.conf.json" | jq -r '.version')
          LOCK_VERSION=$(git show "$MERGE_SHA:src-tauri/Cargo.lock" | \
            awk '/^name = "codefactory"$/ { found=1; next } found && /^version = / { gsub(/^version = "|"$/, ""); print; found=0 }')
          test "$PACKAGE_VERSION" = "$EXPECTED_VERSION" && \
            test "$CARGO_VERSION" = "$EXPECTED_VERSION" && \
            test "$TAURI_VERSION" = "$EXPECTED_VERSION" && \
            test "$LOCK_VERSION" = "$EXPECTED_VERSION" || {
            echo "::error::Tag candidate version manifests do not match $EXPECTED_VERSION"
            exit 1
          }

          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$MERGE_SHA" || {
              echo "::error::$TAG already points to a different commit"
              exit 1
            }
          else
            git tag "$TAG" "$MERGE_SHA"
          fi
          n=0
          until git push origin "$TAG"; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "::error::push of $TAG failed after $n attempts"
              exit 1
            fi
            echo "push of $TAG failed (attempt $n); retrying in $((n * 10))s"
            sleep $((n * 10))
          done
          gh workflow run release.yml --ref main -f tag="$TAG" \
            -f expected_head_sha="$MERGE_SHA"
          echo "Dispatched Release for $TAG from guarded merge $MERGE_SHA"
