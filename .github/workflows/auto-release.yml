name: Auto Release

# RELEASE CADENCE PRINCIPLE — merge continuously, release deliberately.
# This does NOT run on every merge. A release is cut on demand
# (workflow_dispatch) or once daily (schedule), batching everything merged
# since the last tag into ONE versioned release — and only when there's a
# user-facing change (feat/fix) to ship. See docs/principles/release-cadence.md.
#
# It then determines the version slot from ALL commits since the last tag,
# bumps the three version files, pushes a vX.Y.Z tag, then dispatches
# release.yml from main with that tag. Running Release on the default branch
# lets consecutive versions share GitHub cache scope while every build still
# checks out the immutable tag. Bump commits ("chore: bump version to …") are
# excluded so they can never themselves cause a release.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Cut a release even with no feat/fix since the last tag"
        type: boolean
        default: false
  schedule:
    - cron: "0 1 * * *" # daily 01:00 UTC — batches the day's merges into one release

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # RELEASE_PAT remains supported for repositories whose branch rules
          # require it; GITHUB_TOKEN is enough for the explicit dispatch below.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify main governance check is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only gate on governance-baseline (seconds), not full CI (minutes).
          # The PR already ran the full CI suite on the exact same code — the
          # squash merge to main cannot change its outcome. Requiring main CI
          # here just adds 6-8 minutes of dead wait per release.
          HEAD_SHA=$(git rev-parse HEAD)
          CONC=$(gh run list --workflow governance-baseline --branch main --limit 30 \
                   --json headSha,conclusion \
                   -q "[.[] | select(.headSha==\"$HEAD_SHA\")][0].conclusion" 2>/dev/null || echo "")
          if [ -n "$CONC" ] && [ "$CONC" != "success" ]; then
            echo "::error::governance-baseline for $HEAD_SHA is '$CONC' — refusing to release on red."
            exit 1
          fi
          echo "governance-baseline for $HEAD_SHA: ${CONC:-not found, proceeding}"

      - name: Determine version slot from commits since last tag
        id: slot
        run: |
          # Batch the whole window since the last tag — NOT just one commit.
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE="${LAST:+$LAST..}HEAD"
          # Conventional-commit subjects in the window, minus bump commits.
          MSGS=$(git log --format=%s "$RANGE" | grep -v '^chore: bump version to' || true)
          SLOT=none
          while IFS= read -r m; do
            [ -z "$m" ] && continue
            if echo "$m" | grep -qE '^feat[^:]*!:|BREAKING[ -]CHANGE'; then SLOT=major; break; fi
            if echo "$m" | grep -qE '^feat(\([^)]+\))?:'; then SLOT=minor; continue; fi
            if [ "$SLOT" = none ] && echo "$m" | grep -qE '^fix(\([^)]+\))?:'; then SLOT=patch; fi
          done <<< "$MSGS"
          # Principle: only user-facing changes ship. No feat/fix → no release
          # (chore/ci/docs/refactor/test ride the next feat/fix release), unless
          # explicitly forced.
          if [ "$SLOT" = none ]; then
            if [ "${{ github.event.inputs.force }}" = "true" ]; then
              echo "No feat/fix since ${LAST:-repo start}, but force=true → patch."
              SLOT=patch
            else
              echo "Nothing to release: no feat/fix since ${LAST:-repo start}."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "Range: $RANGE  Slot: $SLOT"

      - name: Setup Node.js
        if: steps.slot.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve next version
        id: ver
        if: steps.slot.outputs.skip != 'true'
        run: |
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          CURRENT="${LAST#v}"
          IFS='.' read -r MAJ MIN PAT <<< "$CURRENT"
          SLOT="${{ steps.slot.outputs.slot }}"
          case "$SLOT" in
            major) NEW="$((MAJ+1)).0.0" ;;
            minor) NEW="$MAJ.$((MIN+1)).0" ;;
            patch) NEW="$MAJ.$MIN.$((PAT+1))" ;;
          esac
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW"    >> "$GITHUB_OUTPUT"
          echo "Last: $LAST  Slot: $SLOT  Next: v$NEW"

      - name: Bump version files
        if: steps.slot.outputs.skip != 'true'
        env:
          NEW: ${{ steps.ver.outputs.version }}
        run: |
          # package.json
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version = '$NEW';
            fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
          "
          # src-tauri/Cargo.toml  (first [package] version line only)
          sed -i "0,/^version = \"[^\"]*\"/{s//version = \"$NEW\"/}" src-tauri/Cargo.toml
          # src-tauri/tauri.conf.json
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            c.version = '$NEW';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(c,null,2)+'\n');
          "
          # src-tauri/Cargo.lock — keep the committed lockfile in step with
          # Cargo.toml. We patch the [[package]] codefactory version line directly
          # (the line right after its `name =` line) rather than running
          # `cargo update`: this job sets up no Rust toolchain or registry index,
          # and a stray cargo could rewrite the lockfile format. A workspace
          # member carries no checksum, so this one-line replace is byte-for-byte
          # what cargo itself writes.
          sed -i '/^name = "codefactory"$/{n;s/^version = ".*"/version = "'"$NEW"'"/}' src-tauri/Cargo.lock
          # Fail fast if the lock didn't actually sync — never tag a release whose
          # lockfile disagrees with its manifests.
          grep -A1 '^name = "codefactory"$' src-tauri/Cargo.lock | grep -q "version = \"$NEW\"" || {
            echo "::error::Cargo.lock codefactory entry did not sync to $NEW"; exit 1;
          }

      - name: Commit, tag, push
        if: steps.slot.outputs.skip != 'true'
        env:
          NEW: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json src-tauri/Cargo.lock
          git commit -m "chore: bump version to $NEW"
          git tag "$TAG"
          # GitHub's git backend occasionally 500s on push (transient, observed
          # in practice). Retry each push with linear backoff instead of
          # failing the whole release and leaving the bump unpushed.
          for ref in main "$TAG"; do
            n=0
            until git push origin "$ref"; do
              n=$((n + 1))
              if [ "$n" -ge 5 ]; then
                echo "::error::push of $ref failed after $n attempts"
                exit 1
              fi
              echo "push of $ref failed (attempt $n); retrying in $((n * 10))s"
              sleep $((n * 10))
            done
          done

      - name: Dispatch release build from main
        if: steps.slot.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh workflow run release.yml --ref main -f tag="$TAG"
          echo "Dispatched Release for $TAG from main"
